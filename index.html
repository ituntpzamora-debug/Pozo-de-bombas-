      <${Tile} c="s4" title="Últimos mantenimientos" right=${html`<button class="btn btn-sm" onClick=${() => goTab('mant')}>Ver todos</button>`}>
        ${ult.length ? html`<div class="col">${ult.map((m) => html`<button class="log logbtn" key=${m.key.hash} onClick=${() => m.code && openB(m.code)}>
            <div class="row between"><span class="lbl">${fechaDe(m)} · ${short(m.code || m.codigo)}</span><${ChipT} t=${m.trabajo}/></div>
            <div class="t clamp3">${m.descripcion}</div>
          </button>`)}</div>` : html`<div class="empty">Todavía no hay mantenimientos registrados.</div>`}
      <//>

      ${enProc.length ? html`<${Tile} c="s12" title="Trabajos en proceso" glow="var(--amber)" right=${html`<span class="chip warn"><i></i>${enProc.length}</span>`}>
        <div class="groups">${enProc.map((m) => html`<button class="mant mant-btn" key=${m.key.hash} onClick=${() => m.code && openB(m.code)}>
          <div class="row between"><span class="mono" style=${{ fontWeight: 500 }}>${m.code || m.codigo}</span><span class="lbl">${fechaDe(m)}</span></div>
          <div class="t clamp3">${m.descripcion}</div>
          ${m.obs ? html`<div class="note clamp3">Obs.: ${m.obs}</div>` : null}
        </button>`)}</div>
      <//>` : null}
    </div>`;
  }

  /* =========================================================
     02 · FICHA DE BOMBAS
     ========================================================= */
  function ListaB({ bombas, sel, setSel }) {
    const [q, setQ] = useState('');
    const [ff, setFf] = useState('');
    const [ft, setFt] = useState('');
    const [fe, setFe] = useState('');
    const fincas = U.groupBy(bombas, U.fincaDe).map(([f]) => f);
    const tipos = U.groupBy(bombas, (b) => b.tipoLabel).map(([t]) => t);
    const list = bombas.filter((b) => {
      const s = (b.code + ' ' + b.agricola + ' ' + b.motor + ' ' + b.bomba + ' ' + b.tipoLabel).toLowerCase();
      if (q && !s.includes(q.toLowerCase())) return false;
      if (ff && U.fincaDe(b) !== ff) return false;
      if (ft && b.tipoLabel !== ft) return false;
      if (fe && b.estado !== fe) return false;
      return true;
    });
    return html`<div class="col">
      <input class="inp" placeholder="Buscar código, agrícola, marca…" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Buscar bomba"/>
      <div class="fgrid">
        <select class="inp" value=${ff} onChange=${(e) => setFf(e.target.value)} aria-label="Agrícola"><option value="">Agrícola</option>${fincas.map((f) => html`<option key=${f}>${f}</option>`)}</select>
        <select class="inp" value=${fe} onChange=${(e) => setFe(e.target.value)} aria-label="Estado"><option value="">Estado</option><option>Operativa</option><option>Fuera de servicio</option></select>
        <select class="inp full" value=${ft} onChange=${(e) => setFt(e.target.value)} aria-label="Aplicación"><option value="">Todas las aplicaciones</option>${tipos.map((t) => html`<option key=${t}>${t}</option>`)}</select>
      </div>
      <div class="only-m">
        <select class="inp" value=${sel} onChange=${(e) => setSel(e.target.value)} aria-label="Bomba">
          ${(list.length ? list : bombas).map((b) => html`<option key=${b.code} value=${b.code}>${b.code} · ${b.estado}</option>`)}
        </select>
      </div>
      <div class="list only-d">
        ${list.map((b) => html`<button key=${b.code} class=${'well-row' + (b.code === sel ? ' sel' : '')} onClick=${() => setSel(b.code)}>
          <span class=${'dot ' + clsB(b.estado)}></span>
          <span class="grow"><span class="c">${b.code}</span><br/><span class="a">${b.agricola} · ${b.tipoLabel}</span></span>
        </button>`)}
        ${list.length === 0 ? html`<div class="empty">Sin resultados.</div>` : null}
      </div>
    </div>`;
  }

  function FichaB({ bombas, mants, sel, setSel, canEdit, mutateB, toast, onPdf, pozoDe, goPozo }) {
    const b = bombas.find((x) => x.code === sel) || bombas[0];
    const idx = bombas.indexOf(b);
    const pc = b.pc;
    const go = (d) => setSel(bombas[(idx + d + bombas.length) % bombas.length].code);
    const [form, setForm] = useState(null);
    useEffect(() => { if (form === 'editar') setForm(null); }, [b.code]);
    useEffect(() => { if (!canEdit) setForm(null); }, [canEdit]);
    const ms = mants.filter((m) => m.code === b.code);
    const pozo = pozoDe ? pozoDe(b.code) : null;
    const top = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    return html`<div class="split sec">
      <aside class="tile static side">
        <div class="th"><h3>Bombas</h3><div class="row" style=${{ gap: 8 }}><span class="lbl">${bombas.length}</span>
          ${canEdit ? html`<button class="btn btn-sm btn-acc" onClick=${() => { setForm('nuevo'); top(); }}>+ Nueva bomba</button>` : null}</div></div>
        <${ListaB} bombas=${bombas} sel=${b.code} setSel=${setSel}/>
      </aside>
      <div class="bento">
        ${form && canEdit ? html`<${BombaForm} key=${form + (form === 'editar' ? b.code : '')} modo=${form} b=${form === 'editar' ? b : null} bombas=${bombas}
          mutateB=${mutateB} toast=${toast} onClose=${(code) => { setForm(null); if (code) setSel(code); }}/>` : null}

        <${Tile} c="s12" glow=${glowB(b.estado)}>
          <div class="row between" style=${{ alignItems: 'flex-start' }}>
            <div style=${{ minWidth: 0 }}>
              <div class="lbl">${b.agricola}</div>
              <h2 class="code-title">${b.code}</h2>
              <div class="row" style=${{ marginTop: 8, gap: 6 }}><${ChipB} e=${b.estado}/><span class="chip plain">${b.tipoLabel}</span>
                ${ms.some((m) => m.trabajo === 'En proceso') ? html`<span class="chip warn"><i></i>Trabajo en proceso</span>` : null}</div>
            </div>
            <div class="row">
              <div class="navbtns"><button class="btn" onClick=${() => go(-1)} aria-label="Bomba anterior">←</button>
              <span class="btn mono" style=${{ cursor: 'default' }}>${idx + 1} / ${bombas.length}</span>
              <button class="btn" onClick=${() => go(1)} aria-label="Bomba siguiente">→</button></div>
              ${pozo ? html`<button class="btn" onClick=${() => goPozo(pozo.code)} title="Ver la ficha del pozo donde está esta bomba">${I.drop} Ver pozo</button>` : null}
              <button class="btn btn-acc" onClick=${() => onPdf([b.code])}>${I.pdf} PDF de la bomba</button>
            </div>
          </div>
          <div class="kv5" style=${{ marginTop: 16 }}>
            <${Inset} l="Finca" v=${pc.finca}/>
            <${Inset} l="Sector" v=${pc.sector || '—'}/>
            <${Inset} l="Aplicación" v=${(pc.tipo || '—') + (pc.tipo ? ' · ' + b.tipoLabel : '')}/>
            <${Inset} l="Instalación" v=${U.INSTALACION[pc.inst] ? pc.inst + ' · ' + U.INSTALACION[pc.inst] : (pc.inst || '—')}/>
            <${Inset} l="Potencia" v=${pc.hp ? pc.hp + ' HP' : (b.pot || '—')}/>
          </div>
        <//>

        <${Tile} c="s7" title="Equipo" right=${canEdit ? html`<button class="btn btn-sm" onClick=${() => { setForm('editar'); top(); }}>Editar datos</button>` : null}>
          <div class="kv">
            <${Inset} l="Motor" v=${b.motor || 's/d'}/>
            <${Inset} l="Bomba" v=${b.bomba || 's/d'}/>
            <${Inset} l="Potencia / capacidad" v=${b.potencia || '—'}/>
            <${Inset} l="Corriente In (A)" v=${b.corriente || '—'}/>
            <${Inset} l="Cañería" v=${b.caneria || '—'}/>
            <${Inset} l="Alimentación" v=${U.alimentacion(b.red)}/>
          </div>
        <//>

        <${Tile} c="s5" title="Ubicación">
          ${b.lat != null ? html`<a class="loc-link" href=${U.mapsUrl(b.lat, b.lon)} target="_blank" rel="noopener">
            <span class="loc-ico">${I.pin}</span>
            <span class="grow"><b>Ver en Google Maps</b><span class="note">${b.agricola}</span></span>
            <span class="loc-arrow">↗</span>
          </a>` : html`<div class="empty">Esta bomba no tiene ubicación cargada en la hoja.</div>`}
          ${pozo ? html`<button class="loc-link" style=${{ marginTop: 10, width: '100%', textAlign: 'left', cursor: 'pointer' }} onClick=${() => goPozo(pozo.code)}>
            <span class="loc-ico">${I.drop}</span>
            <span class="grow"><b>Pozo ${short(pozo.code)}</b><span class="note">Esta bomba está instalada en el pozo · ver su ficha</span></span>
            <span class="loc-arrow">→</span>
          </button>` : null}
        <//>

        <${EstadoB} b=${b} ms=${ms} canEdit=${canEdit} mutateB=${mutateB} toast=${toast}/>
        <${MantsB} b=${b} ms=${ms} canEdit=${canEdit} mutateB=${mutateB} toast=${toast}/>
      </div>
    </div>`;
  }

  function EstadoB({ b, ms, canEdit, mutateB, toast }) {
    const [edit, setEdit] = useState(false);
    const [f, setF] = useState({});
    const [busy, setBusy] = useState(false);
    useEffect(() => setEdit(false), [b.code, canEdit]);
    const ult = ms.find((m) => m.fecha) || null;
    const open = () => { setF({ estado: b.estado === 's/d' ? 'Operativa' : b.estado, obs: b.obs || '' }); setEdit(true); };
    const save = async () => {
      setBusy(true);
      const ok = await mutateB([{ op: 'put', col: 'bombas', id: b.code, data: { estado: f.estado, obs: f.obs.trim() } }]);
      setBusy(false);
      if (ok) { setEdit(false); toast('Estado de la bomba guardado en Registro BOMBA.'); }
    };
    return html`<${Tile} c="s5" title="Estado actual" glow=${glowB(b.estado)} right=${!edit && canEdit ? html`<button class="btn btn-sm btn-acc" onClick=${open}>Actualizar</button>` : null}>
      ${edit && canEdit ? html`<div class="col">
        <div class="seg2">
          <button class=${'ok' + (f.estado === 'Operativa' ? ' on' : '')} onClick=${() => setF(Object.assign({}, f, { estado: 'Operativa' }))}>Operativa</button>
          <button class=${'bad' + (f.estado === 'Fuera de servicio' ? ' on' : '')} onClick=${() => setF(Object.assign({}, f, { estado: 'Fuera de servicio' }))}>Fuera de servicio</button>
        </div>
        <${Fld} l="Observaciones"><textarea class="inp" value=${f.obs} onInput=${(e) => setF(Object.assign({}, f, { obs: e.target.value }))} placeholder="Ej.: se retiró el arranque suave para la casilla 1"></textarea><//>
        <div class="row" style=${{ justifyContent: 'flex-end' }}>
          <button class="btn" onClick=${() => setEdit(false)}>Cancelar</button>
          <button class="btn btn-acc" disabled=${busy} onClick=${save}>${busy ? 'Guardando…' : 'Guardar'}</button>
        </div>
      </div>` : html`<div class="col">
        <div class="disp" style=${{ fontSize: 26, fontWeight: 600, color: `var(--${clsB(b.estado)})` }}>${b.estado === 's/d' ? 'Sin estado' : b.estado}</div>
        ${b.obs ? html`<div class="inset"><div class="lbl">Observaciones</div><div style=${{ marginTop: 4, whiteSpace: 'pre-wrap' }}>${b.obs}</div></div>` : null}
        <div class="inset">
          <div class="lbl">Último mantenimiento</div>
          ${ult ? html`<div class="row between" style=${{ marginTop: 4 }}><span class="mono">${U.fmtF(ult.fecha)}</span><${ChipT} t=${ult.trabajo}/></div>
            <div class="clamp3" style=${{ marginTop: 4 }}>${ult.descripcion}</div>`
          : b.ultMantReg ? html`<div class="mono" style=${{ marginTop: 4 }}>${b.ultFechaReg ? U.fmtF(b.ultFechaReg) : ''}</div><div class="clamp3">${b.ultMantReg}</div>`
          : html`<div class="muted" style=${{ marginTop: 4 }}>Sin mantenimientos registrados.</div>`}
        </div>
      </div>`}
    <//>`;
  }

  function MantForm({ b, bombas, m, mutateB, toast, onClose }) {
    const nuevo = !m;
    const [f, setF] = useState(() => ({
      code: b ? b.code : '', fecha: m ? (m.fecha || '') : U.hoy(), trabajo: m ? (TRABAJOS.includes(m.trabajo) ? m.trabajo : 'En proceso') : 'En proceso',
      descripcion: m ? m.descripcion : '', recep: m ? m.recep : '', usd: m && m.usd != null ? String(m.usd) : '', obs: m ? m.obs : ''
    }));
    const [busy, setBusy] = useState(false);
    const set = (k) => (e) => setF(Object.assign({}, f, { [k]: e.target.value }));
    const bomba = bombas.find((x) => x.code === f.code);
    const save = async () => {
      if (nuevo && !bomba) return toast('Elegí la bomba.', 'bad');
      if (!f.descripcion.trim()) return toast('Escribí la descripción del trabajo.', 'bad');
      if (nuevo && !f.fecha) return toast('Cargá la fecha.', 'bad');
      const usdN = f.usd.trim() === '' ? '' : U.usd(f.usd);
      if (usdN === null) return toast('El presupuesto tiene que ser un número (USD).', 'bad');
      const data = { descripcion: f.descripcion.trim(), estado: f.trabajo, recep: f.recep.trim(), presupuesto: usdN, obs: f.obs.trim() };
      if (f.fecha) data.fecha = f.fecha;
      if (nuevo) { data.codigo = bomba.code; data.agricola = bomba.agricola; } else { data.key = m.key; data.codigo = m.codigo; }
      setBusy(true);
      const ok = await mutateB([{ op: 'put', col: 'mant', id: nuevo ? 'nuevo' : m.key.hash, data }]);
      setBusy(false);
      if (ok) { toast(nuevo ? 'Mantenimiento agregado a la hoja.' : 'Mantenimiento actualizado en la hoja.'); onClose(nuevo ? bomba.code : null); }
    };
    return html`<div class="mant-form">
      <div class="row between" style=${{ marginBottom: 10 }}>
        <b>${nuevo ? 'Nuevo mantenimiento' : 'Editar mantenimiento'}</b>
        <span class="lbl">Se guarda en la hoja Mantenimiento de BOMBAS</span>
      </div>
      <div class="fgrid" style=${{ gridTemplateColumns: 'repeat(auto-fit,minmax(170px,1fr))' }}>
        ${nuevo && !b ? html`<${Fld} l="Bomba *"><select class="inp mono" value=${f.code} onChange=${set('code')}>
          <option value="">Elegí…</option>${bombas.map((x) => html`<option key=${x.code} value=${x.code}>${x.code}</option>`)}</select><//>` : null}
        <${Fld} l=${nuevo ? 'Fecha *' : 'Fecha'}><input type="date" class="inp" value=${f.fecha} onInput=${set('fecha')}/><//>
        <${Fld} l="Estado del trabajo"><select class="inp" value=${f.trabajo} onChange=${set('trabajo')}>${TRABAJOS.map((t) => html`<option key=${t}>${t}</option>`)}</select><//>
        <${Fld} l="N° recepción / orden de compra"><input class="inp" value=${f.recep} onInput=${set('recep')}/><//>
        <${Fld} l="Presupuesto (USD)"><input class="inp" inputmode="decimal" value=${f.usd} onInput=${set('usd')} placeholder="0"/><//>
      </div>
      <div class="fgrid" style=${{ marginTop: 10 }}>
        <${Fld} l="Descripción del mantenimiento *" full><textarea class="inp" value=${f.descripcion} onInput=${set('descripcion')} placeholder="Qué se hizo, qué se cambió, quién lo hizo…"></textarea><//>
        <${Fld} l="Observaciones" full><textarea class="inp" value=${f.obs} onInput=${set('obs')} placeholder="Pendientes, recomendaciones…"></textarea><//>
      </div>
      ${!nuevo && !m.fecha && m.fechaTxt ? html`<div class="warn" style=${{ marginTop: 6 }}>En la hoja la fecha figura como “${m.fechaTxt}”. Si elegís una fecha acá, se corrige.</div>` : null}
      <div class="row" style=${{ justifyContent: 'flex-end', marginTop: 10 }}>
        <button class="btn" onClick=${() => onClose(null)}>Cancelar</button>
        <button class="btn btn-acc" disabled=${busy} onClick=${save}>${busy ? 'Guardando…' : nuevo ? 'Agregar mantenimiento' : 'Guardar cambios'}</button>
      </div>
    </div>`;
  }

  function MantItem({ m, canEdit, onEdit, onDel, showCode, onOpen }) {
    return html`<div class="mant">
      <div class="row between" style=${{ gap: 8 }}>
        <span class="row" style=${{ gap: 8 }}>
          <span class="mono" style=${{ fontWeight: 500 }}>${fechaDe(m)}</span>
          ${showCode ? html`<button class="chip plain click" onClick=${onOpen}>${m.code || m.codigo}</button>` : null}
          <${ChipT} t=${m.trabajo}/>
        </span>
        <span class="row" style=${{ gap: 6 }}>
          ${m.usd ? html`<span class="mono usd">${U.fmtUSD(m.usd)}</span>` : null}
          ${canEdit ? html`<button class="btn btn-sm btn-ghost" title="Editar" onClick=${onEdit}>✎</button><${ConfirmDel} onYes=${onDel}/>` : null}
        </span>
      </div>
      <div class="t">${m.descripcion}</div>
      ${m.obs ? html`<div class="note"><b>Obs.:</b> ${m.obs}</div>` : null}
      <div class="lbl" style=${{ marginTop: 2 }}>${m.recep ? 'Recep./OC ' + m.recep : ''}${m.code && U.normCode(m.codigo) !== m.code ? (m.recep ? ' · ' : '') + 'en la hoja figura como ' + m.codigo : ''}</div>
    </div>`;
  }

  function MantsB({ b, ms, canEdit, mutateB, toast }) {
    const [form, setForm] = useState(null); // null | 'nuevo' | mant
    useEffect(() => setForm(null), [b.code, canEdit]);
    const del = async (m) => { const ok = await mutateB([{ op: 'del', col: 'mant', id: m.key.hash, data: { key: m.key } }]); if (ok) toast('Mantenimiento borrado de la hoja.'); };
    const tot = sumUSD(ms);
    return html`<${Tile} c="s7" title="Mantenimientos" right=${html`<div class="row" style=${{ gap: 6 }}>
        <span class="chip plain mono">${ms.length} trabajo${ms.length === 1 ? '' : 's'}${tot ? ' · ' + U.fmtUSD(tot) : ''}</span>
        ${canEdit && !form ? html`<button class="btn btn-sm btn-acc" onClick=${() => setForm('nuevo')}>+ Registrar</button>` : null}</div>`}>
      ${form && canEdit ? html`<${MantForm} key=${form === 'nuevo' ? 'n' : form.key.hash} b=${b} bombas=${[b]} m=${form === 'nuevo' ? null : form} mutateB=${mutateB} toast=${toast} onClose=${() => setForm(null)}/>` : null}
      ${ms.length ? html`<div class="col" style=${{ marginTop: form ? 12 : 0 }}>${ms.map((m) => html`<${MantItem} key=${m.key.hash} m=${m} canEdit=${canEdit} onEdit=${() => setForm(m)} onDel=${() => del(m)}/>`)}</div>`
        : html`<div class="empty">${canEdit ? html`Sin mantenimientos. Tocá <b>+ Registrar</b> o cargalo directamente en la hoja.` : 'Sin mantenimientos registrados para esta bomba.'}</div>`}
    <//>`;
  }

  function BombaForm({ modo, b, bombas, mutateB, toast, onClose }) {
    const nuevo = modo === 'nuevo';
    const ini = {
      code: nuevo ? '' : b.code, agricola: nuevo ? '' : lim(b.agricola), gms: nuevo ? '' : lim(b.gms), motor: nuevo ? '' : lim(b.motor), bomba: nuevo ? '' : lim(b.bomba),
      potencia: nuevo ? '' : lim(b.potencia), corriente: nuevo ? '' : lim(b.corriente), caneria: nuevo ? '' : lim(b.caneria), red: nuevo ? '' : lim(b.red),
      estado: nuevo ? 'Operativa' : (b.estado === 's/d' ? 'Operativa' : b.estado), obs: nuevo ? '' : lim(b.obs)
    };
    const [f, setF] = useState(ini);
    const [busy, setBusy] = useState(false);
    const set = (k) => (e) => setF(Object.assign({}, f, { [k]: e.target.value }));
    const code = U.normCode(f.code);
    const pc = U.parseCodeB(code);
    const ll = U.parseGMS(f.gms);
    const dup = nuevo && code && bombas.some((x) => x.code === code);
    const save = async () => {
      if (!code) return toast('Poné el código de la bomba.', 'bad');
      if (dup) return toast('Ya existe una bomba con ese código.', 'bad');
      if (!f.agricola.trim()) return toast('Poné la agrícola.', 'bad');
      if (f.gms.trim() && !ll) return toast('No entiendo la ubicación. Usá 27° 6\' 8.9" S 65° 34\' 23.4" W', 'bad');
      // Solo se mandan los campos que cambiaron, para no reescribir celdas de la hoja sin necesidad.
      const d = {};
      const ch = (k) => nuevo || f[k].trim() !== String(ini[k]).trim();
      if (ch('agricola')) d.agricola = f.agricola.trim().toUpperCase();
      if (ch('gms')) d.ubicacion = f.gms.trim();
      if (ch('motor') || ch('bomba')) d.marcaModelo = [f.motor.trim() ? 'Motor: ' + f.motor.trim() : '', f.bomba.trim() ? 'Bomba: ' + f.bomba.trim() : ''].filter(Boolean).join('/');
      if (ch('potencia')) d.potencia = f.potencia.trim();
      if (ch('corriente')) d.corriente = f.corriente.trim();
      if (ch('caneria')) d.canos = f.caneria.trim();
      if (ch('red')) d.red = f.red.trim();
      if (ch('estado')) d.estado = f.estado;
      if (ch('obs')) d.obs = f.obs.trim();
      if (!Object.keys(d).length) return onClose(null);
      setBusy(true);
      const ok = await mutateB([{ op: 'put', col: 'bombas', id: code, data: d }]);
      setBusy(false);
      if (ok) { toast(nuevo ? 'Bomba agregada a Registro BOMBA.' : 'Datos de la bomba guardados.'); onClose(code); }
    };
    return html`<${Tile} c="s12" cn="static" glow="var(--lime)" title=${nuevo ? 'Nueva bomba' : 'Editar datos de la bomba'} right=${html`<span class="lbl">Se guarda en la hoja Registro BOMBA</span>`}>
      <div class="fgrid" style=${{ gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))' }}>
        <${Fld} l="Código de equipo *"><input class="inp mono" value=${f.code} disabled=${!nuevo} onInput=${set('code')} placeholder="FINCA-SECTOR-TIPO-INST-HP"/><//>
        <${Fld} l="Agrícola *"><input class="inp" value=${f.agricola} onInput=${set('agricola')} placeholder="TDA - REPRESA"/><//>
        <${Fld} l="Estado actual"><select class="inp" value=${f.estado} onChange=${set('estado')}><option>Operativa</option><option>Fuera de servicio</option></select><//>
        <${Fld} l="Ubicación (grados, minutos, segundos)"><input class="inp mono" value=${f.gms} onInput=${set('gms')}/><//>
        <${Fld} l="Motor"><input class="inp" value=${f.motor} onInput=${set('motor')} placeholder="WEG 125"/><//>
        <${Fld} l="Bomba"><input class="inp" value=${f.bomba} onInput=${set('bomba')} placeholder="DAB KDN 100-250"/><//>
        <${Fld} l="Pot / capacidad"><input class="inp" value=${f.potencia} onInput=${set('potencia')} placeholder="125HP/"/><//>
        <${Fld} l="Corriente In (A)"><input class="inp" value=${f.corriente} onInput=${set('corriente')}/><//>
        <${Fld} l="Cant. caños y diámetro"><input class="inp" value=${f.caneria} onInput=${set('caneria')}/><//>
        <${Fld} l="Red / Grupo"><input class="inp" value=${f.red} onInput=${set('red')} placeholder="Red"/><//>
        <${Fld} l="Observaciones"><input class="inp" value=${f.obs} onInput=${set('obs')}/><//>
      </div>
      <div class="row between" style=${{ marginTop: 12 }}>
        <div class="note">
          ${code ? html`<span class="mono">${pc.finca}</span> · ${pc.tipo ? U.tipoLabel(pc.tipoBase) : 'tipo no reconocido'} · ${U.INSTALACION[pc.inst] || pc.inst || '—'}${pc.hp ? ' · ' + pc.hp + ' HP' : ''}` : 'Formato: FINCA-SECTOR-TIPO-INSTALACIÓN-HP (BP pozo · BH antiheladas · BR riego · BF fertirriego · BB booster · S sumergida · C centrífuga)'}
          ${f.gms ? (ll ? html` · ubicación ✓` : html` · <span class="warn">ubicación no reconocida</span>`) : null}
          ${dup ? html` · <span class="warn">el código ya existe</span>` : null}
        </div>
        <div class="row">
          <button class="btn" onClick=${() => onClose(null)}>Cancelar</button>
          <button class="btn btn-acc" disabled=${busy} onClick=${save}>${busy ? 'Guardando…' : (nuevo ? 'Agregar bomba' : 'Guardar cambios')}</button>
        </div>
      </div>
      ${!nuevo ? html`<p class="note" style=${{ marginBottom: 0 }}>Para dar de baja una bomba, borrá su fila en la hoja Registro BOMBA.</p>` : null}
    <//>`;
  }

  /* =========================================================
     03 · MANTENIMIENTOS (todas las bombas)
     ========================================================= */
  function MantsTab({ bombas, mants, canEdit, mutateB, toast, openB, pal }) {
    const [q, setQ] = useState('');
    const [ff, setFf] = useState('');
    const [ft, setFt] = useState('');
    const [fa, setFa] = useState('');
    const [form, setForm] = useState(null);
    useEffect(() => { if (!canEdit) setForm(null); }, [canEdit]);
    const bIdx = useMemo(() => new Map(bombas.map((b) => [b.code, b])), [bombas]);
    const fincas = U.groupBy(bombas, U.fincaDe).map(([f]) => f);
    const anios = Array.from(new Set(mants.filter((m) => m.fecha).map((m) => m.fecha.slice(0, 4)))).sort().reverse();
    const list = mants.filter((m) => {
      const b = m.code ? bIdx.get(m.code) : null;
      const s = (m.codigo + ' ' + (m.code || '') + ' ' + m.descripcion + ' ' + m.obs + ' ' + m.recep + ' ' + m.agricola).toLowerCase();
      if (q && !s.includes(q.toLowerCase())) return false;
      if (ff && (b ? U.fincaDe(b) : String(m.agricola).split(' - ')[0].toUpperCase()) !== ff) return false;
      if (ft && m.trabajo !== ft) return false;
      if (fa && (!m.fecha || m.fecha.slice(0, 4) !== fa)) return false;
      return true;
    });
    const enProc = list.filter((m) => m.trabajo === 'En proceso').length;
    const porAnio = Array.from(new Set(list.filter((m) => m.fecha).map((m) => m.fecha.slice(0, 4)))).sort()
      .map((a) => ({ anio: a, usd: Math.round(sumUSD(list.filter((m) => m.fecha && m.fecha.startsWith(a)))), n: list.filter((m) => m.fecha && m.fecha.startsWith(a)).length }));
    const del = async (m) => { const ok = await mutateB([{ op: 'del', col: 'mant', id: m.key.hash, data: { key: m.key } }]); if (ok) toast('Mantenimiento borrado de la hoja.'); };
    const filtros = q || ff || ft || fa;
    return html`<div class="bento sec">
      <${Tile} c="s3" title="Trabajos"><div class="big">${list.length}</div><div class="note">${filtros ? 'con los filtros elegidos' : 'registrados en la hoja'}</div><//>
      <${Tile} c="s3" title="En proceso" glow="var(--amber)"><div class="big" style=${{ color: 'var(--amber)' }}>${enProc}</div><div class="note">sin terminar</div><//>
      <${Tile} c="s3" title="Inversión registrada" glow="var(--lime)"><div class="big grad" style=${{ fontSize: 'clamp(34px,4vw,48px)' }}>${U.fmtUSD(sumUSD(list)).replace('USD ', 'U$S ')}</div><div class="note">suma de “Presupuesto USD”</div><//>
      <${Tile} c="s3" title="Bombas intervenidas"><div class="big">${new Set(list.map((m) => m.code || m.codigo)).size}</div><div class="note">de ${bombas.length} registradas</div><//>

      <${Tile} c="s12" title="Inversión en mantenimiento por año">
        ${porAnio.length && RC ? html`<div style=${{ height: 200 }}>
          <${RC.ResponsiveContainer} width="100%" height="100%">
            <${RC.BarChart} data=${porAnio} margin=${{ top: 6, right: 6, left: 6, bottom: 0 }} barCategoryGap="30%">
              <defs><linearGradient id="bUsd" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color=${pal.aqua}/><stop offset="100%" stop-color=${pal.lime}/></linearGradient></defs>
              <${RC.CartesianGrid} stroke=${pal.grid} vertical=${false}/>
              <${RC.XAxis} dataKey="anio" tick=${{ fill: pal.axis, fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }} axisLine=${false} tickLine=${false}/>
              <${RC.YAxis} tick=${{ fill: pal.axis, fontSize: 11 }} axisLine=${false} tickLine=${false} tickFormatter=${(v) => 'U$S ' + U.fmtN(v, 0)} width=${72}/>
              <${RC.Tooltip} cursor=${{ fill: pal.grid }} contentStyle=${tooltipStyle} formatter=${(v, n, p) => [U.fmtUSD(v) + ' · ' + p.payload.n + ' trabajos', 'Inversión']}/>
              <${RC.Bar} dataKey="usd" name="Inversión" fill="url(#bUsd)" radius=${[8, 8, 0, 0]}/>
            <//>
          <//>
        </div>` : html`<div class="empty">Sin trabajos con fecha para graficar.</div>`}
      <//>

      <${Tile} c="s12" cn="static" title="Registro de mantenimientos" right=${canEdit && !form ? html`<button class="btn btn-sm btn-acc" onClick=${() => setForm('nuevo')}>+ Nuevo mantenimiento</button>` : null}>
        ${form && canEdit ? html`<div style=${{ marginBottom: 14 }}><${MantForm} key=${form === 'nuevo' ? 'n' : form.key.hash} b=${form !== 'nuevo' && form.code ? bIdx.get(form.code) : null} bombas=${bombas}
          m=${form === 'nuevo' ? null : form} mutateB=${mutateB} toast=${toast} onClose=${() => setForm(null)}/></div>` : null}
        <div class="filters">
          <input class="inp" placeholder="Buscar en descripción, código, OC…" value=${q} onInput=${(e) => setQ(e.target.value)}/>
          <select class="inp" value=${ff} onChange=${(e) => setFf(e.target.value)}><option value="">Agrícola</option>${fincas.map((f) => html`<option key=${f}>${f}</option>`)}</select>
          <select class="inp" value=${ft} onChange=${(e) => setFt(e.target.value)}><option value="">Estado del trabajo</option>${TRABAJOS.map((t) => html`<option key=${t}>${t}</option>`)}</select>
          <select class="inp" value=${fa} onChange=${(e) => setFa(e.target.value)}><option value="">Año</option>${anios.map((a) => html`<option key=${a}>${a}</option>`)}</select>
          ${filtros ? html`<button class="btn btn-sm" onClick=${() => { setQ(''); setFf(''); setFt(''); setFa(''); }}>Limpiar</button>` : null}
        </div>
        <div class="col" style=${{ marginTop: 12 }}>
          ${list.map((m) => html`<${MantItem} key=${m.key.hash} m=${m} showCode canEdit=${canEdit} onOpen=${() => m.code && openB(m.code)}
            onEdit=${() => { setForm(m); window.scrollTo({ top: 0, behavior: 'smooth' }); }} onDel=${() => del(m)}/>`)}
          ${!list.length ? html`<div class="empty">No hay trabajos con esos filtros.</div>` : null}
        </div>
        <p class="note" style=${{ marginBottom: 0 }}>Esta lista es la hoja “Mantenimiento de BOMBAS”: lo que cargues a mano en la planilla aparece acá al tocar <b>Recargar</b>, y lo que cargues acá se escribe en la hoja.</p>
      <//>
    </div>`;
  }

  /* =========================================================
     04 · INFORME
     ========================================================= */
  function InformeB({ bombas, mants, openB, onPdf, logoUrl }) {
    const [selSet, setSelSet] = useState(() => new Set(bombas.map((b) => b.code)));
    const known = useRef(new Set(bombas.map((b) => b.code)));
    useEffect(() => {
      const nuevos = bombas.filter((b) => !known.current.has(b.code)).map((b) => b.code);
      if (!nuevos.length) return;
      nuevos.forEach((c) => known.current.add(c));
      setSelSet((s) => new Set([...s, ...nuevos]));
    }, [bombas]);
    const chosen = bombas.filter((b) => selSet.has(b.code));
    const op = chosen.filter((b) => b.estado === 'Operativa').length;
    const fs = chosen.filter((b) => b.estado === 'Fuera de servicio').length;
    const pct = chosen.length ? Math.round((op / chosen.length) * 100) : 0;
    const toggle = (c) => { const n = new Set(selSet); n.has(c) ? n.delete(c) : n.add(c); setSelSet(n); };
    const tipos = U.groupBy(bombas, (b) => b.tipoLabel).map(([t]) => t);
    const enProc = new Set(mants.filter((m) => m.trabajo === 'En proceso' && m.code).map((m) => m.code));
    const msDe = (c) => mants.filter((m) => m.code === c);
    const [busy, setBusy] = useState(false);
    const gen = async () => { setBusy(true); try { await onPdf(chosen.map((b) => b.code)); } finally { setBusy(false); } };
    return html`<div class="bento sec">
      <${Tile} c="s12" glow="var(--lime)">
        <div class="row between" style=${{ alignItems: 'flex-start' }}>
          <div>
            <div class="lbl">Informe · ${U.fmtF(U.hoy())}</div>
            <h2 class="h1" style=${{ fontSize: 'clamp(22px,3.4vw,34px)' }}>Estado de <span class="grad">bombas de agua</span></h2>
            <p class="muted" style=${{ margin: 0 }}>${chosen.length} bomba${chosen.length === 1 ? '' : 's'}: ${op} operativa${op === 1 ? '' : 's'} y ${fs} fuera de servicio · ${pct}% de disponibilidad.</p>
          </div>
          <div class="plate plate-lg">${logoUrl ? html`<img src=${logoUrl} alt="Grupo MP"/>` : html`<b>GMP</b>`}</div>
        </div>
      <//>
      <${Tile} c="s3" title="Bombas incluidas"><div class="big">${chosen.length}</div><//>
      <${Tile} c="s3" title="Operativas" glow="var(--ok)"><div class="big" style=${{ color: 'var(--ok)' }}>${op}</div><//>
      <${Tile} c="s3" title="Fuera de servicio" glow="var(--bad)"><div class="big" style=${{ color: 'var(--bad)' }}>${fs}</div><//>
      <${Tile} c="s3" title="Disponibilidad" glow="var(--lime)"><div class="big grad">${pct}%</div><div class="bar" style=${{ marginTop: 12 }}><i style=${{ width: pct + '%' }}></i></div><//>

      <${Tile} c="s4" title="Paso 1 · Elegí las bombas" cn="static">
        <div class="row" style=${{ gap: 6, marginBottom: 8 }}>
          <button class="btn btn-sm" onClick=${() => setSelSet(new Set(bombas.map((b) => b.code)))}>Todas</button>
          <button class="btn btn-sm" onClick=${() => setSelSet(new Set(bombas.filter((b) => b.estado === 'Fuera de servicio').map((b) => b.code)))}>Fuera de servicio</button>
          <button class="btn btn-sm" onClick=${() => setSelSet(new Set(bombas.filter((b) => enProc.has(b.code)).map((b) => b.code)))}>Con trabajos en proceso</button>
          <button class="btn btn-sm" onClick=${() => setSelSet(new Set())}>Ninguna</button>
        </div>
        <select class="inp" style=${{ marginBottom: 8 }} value="" onChange=${(e) => e.target.value && setSelSet(new Set(bombas.filter((b) => b.tipoLabel === e.target.value).map((b) => b.code)))}>
          <option value="">Solo una aplicación…</option>${tipos.map((t) => html`<option key=${t}>${t}</option>`)}
        </select>
        <div class="checks">
          ${bombas.map((b) => html`<label class="ck" key=${b.code}>
            <input type="checkbox" checked=${selSet.has(b.code)} onChange=${() => toggle(b.code)}/>
            <span class=${'dot ' + clsB(b.estado)}></span>
            <span class="mono" style=${{ fontSize: 12.5, overflowWrap: 'anywhere' }}>${b.code}</span>
          </label>`)}
        </div>
        <button class="btn btn-acc" style=${{ width: '100%', marginTop: 12 }} disabled=${!chosen.length || busy} onClick=${gen}>${I.pdf} ${busy ? 'Generando…' : `Generar PDF (${chosen.length} bomba${chosen.length === 1 ? '' : 's'})`}</button>
      <//>

      <${Tile} c="s8" title="Paso 2 · Vista previa — Situación por bomba" cn="static">
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Código</th><th>Agrícola</th><th>Aplicación</th><th>Estado</th><th>Último mant.</th><th>Invertido</th></tr></thead>
          <tbody>${chosen.map((b) => { const ms = msDe(b.code); const u = ms.find((m) => m.fecha); return html`<tr key=${b.code} class="click" onClick=${() => openB(b.code)}>
            <td class="mono" style=${{ fontSize: 12 }}>${b.code}</td><td>${b.agricola}</td><td>${b.tipoLabel}</td>
            <td><${ChipB} e=${b.estado}/></td><td class="mono">${u ? U.fmtF(u.fecha) : '—'}</td><td class="mono">${sumUSD(ms) ? U.fmtUSD(sumUSD(ms)) : '—'}</td>
          </tr>`; })}</tbody>
        </table></div>
        ${!chosen.length ? html`<div class="empty" style=${{ marginTop: 10 }}>Elegí al menos una bomba.</div>` : null}
        <p class="note">El PDF incluye una portada con los indicadores, los trabajos en proceso y una ficha por bomba con su historial de mantenimientos. Tocá una fila para abrir la ficha.</p>
      <//>
    </div>`;
  }

  return { ResumenB, FichaB, MantsTab, InformeB, clsB };
};

</script>
<script>
/* ---- js/app.js ---- */
/* Dashboard de Pozos de Agua Profunda — Grupo MP
   React 18 + htm (sin compilar) · Recharts · Leaflet · jsPDF */
(function () {
  'use strict';
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const html = htm.bind(React.createElement);
  const RC = window.Recharts || null;
  const CFG = Object.assign({ API_URL: '', TOKEN: '', SHEET_URL: '#', DATOS_AL: '', LEER_REGISTRO: true, EXTRA_WELLS: [] }, window.POZOS_CONFIG || {});
  const U = window.PozosUtil;

  const TABS = [
    { id: 'resumen', n: '01', t: 'Resumen' },
    { id: 'ficha', n: '02', t: 'Ficha de pozos' },
    { id: 'mapa', n: '03', t: 'Mapa' },
    { id: 'informe', n: '04', t: 'Informe' }
  ];
  const DESTINOS = ['Riego', 'Antiheladas', 'Llenado de represa', 'Empaque / proceso', 'Consumo / uso general', 'Respaldo', 'Otro'];
  const TIPOS_ACCION = ['Inspección', 'Medición', 'Videofilmación', 'Limpieza / desarrollo', 'Intervención', 'Observación'];
  const TIPOS_ADJ = ['Video', 'Informe', 'Foto', 'Plano', 'Otro'];
  const PAL = {
    dark: { lime: '#c6f65b', aqua: '#5fe3cf', violet: '#9d8fff', rose: '#ff6f7d', amber: '#f6b862', grid: 'rgba(255,255,255,.06)', axis: '#7d8984', ok: '#5fe3a1', bad: '#ff6f7d', na: '#8d9994' },
    light: { lime: '#76a800', aqua: '#0fa595', violet: '#6c5ce7', rose: '#e0475a', amber: '#d98a14', grid: 'rgba(16,40,30,.08)', axis: '#6d7a74', ok: '#11855a', bad: '#c92f43', na: '#6d7a74' }
  };

  /* ---------- Íconos ---------- */
  const I = {
    sun: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    moon: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`,
    refresh: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>`,
    lock: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
    user: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`,
    drop: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6.5 7.2 6.5 11.8a6.5 6.5 0 0 1-13 0C5.5 9.9 12 2.7 12 2.7z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg>`,
    pump: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="13" r="5.5"/><circle cx="9" cy="13" r="1.6"/><path d="M14.5 13H21M17.5 9v8M9 7.5V3h4"/></svg>`,
    home: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>`,
    pin: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>`,
    pdf: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"/></svg>`
  };

  /* ---------- Almacenamiento ---------- */
  const LS_DATA = 'pozos-gmp-datos-v1';
  const LS_CACHE = 'pozos-gmp-cache-v1';
  const lsGet = (k) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin espacio o bloqueado */ } };

  function makeStore() {
    if (CFG.API_URL) {
      const post = async (body) => {
        if (CFG.TOKEN) body.token = CFG.TOKEN;
        const r = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
        const j = await r.json();
        if (!j.ok) { const err = new Error(j.error || 'Error del servidor'); err.auth = !!j.auth; throw err; }
        return j;
      };
      return {
        mode: 'sheets',
        async load() {
          const u = new URL(CFG.API_URL);
          u.searchParams.set('action', 'all');
          if (CFG.TOKEN) u.searchParams.set('token', CFG.TOKEN);
          if (!CFG.LEER_REGISTRO) u.searchParams.set('registro', '0');
          const r = await fetch(u.toString());
          const j = await r.json();
          if (!j.ok) throw new Error(j.error || 'Error del servidor');
          const data = U.normalizeData(j.data);
          const res = { data, registro: j.registro || null, bombas: j.bombas || null, mants: j.mants || null, planilla: j.planilla || null };
          lsSet(LS_CACHE, Object.assign({ at: Date.now() }, res));
          return res;
        },
        bulk: (ops, session) => post({ action: 'bulk', ops, session }),
        login: (user, pass) => post({ action: 'login', user, pass }),
        check: (session) => post({ action: 'check', session })
      };
    }
    return {
      mode: 'local',
      async load() { const d = lsGet(LS_DATA) || {}; return { data: U.normalizeData(d.pozos ? d.pozos : d), registro: null, bombas: d.bombas || null, mants: d.mants || null }; },
      async bulk() { return { ok: true }; },
      async login() { return { ok: true }; },
      async check() { return { ok: true }; }
    };
  }
  const store = makeStore();

  /* ---------- Sesión de administrador ---------- */
  const LS_ADMIN = 'pozos-gmp-admin';
  const leerSesion = () => { const s = lsGet(LS_ADMIN); return s && s.exp > Date.now() && s.session ? s : null; };
  const borrarSesion = () => { try { localStorage.removeItem(LS_ADMIN); } catch (e) { } };

  function LoginModal({ onClose, onOk }) {
    const [u, setU] = useState('');
    const [p, setP] = useState('');
    const [err, setErr] = useState('');
    const [busy, setBusy] = useState(false);
    const ref = useRef(null);
    useEffect(() => {
      if (ref.current) ref.current.focus();
      const f = (ev) => { if (ev.key === 'Escape') onClose(); };
      window.addEventListener('keydown', f);
      return () => window.removeEventListener('keydown', f);
    }, []);
    const go = async (ev) => {
      ev.preventDefault();
      if (!u.trim() || !p) return setErr('Completá usuario y clave.');
      setBusy(true); setErr('');
      try {
        const r = await store.login(u.trim(), p);
        onOk({ user: r.user, session: r.session, exp: r.exp });
      } catch (e) { setErr(e.message || 'No se pudo ingresar.'); setBusy(false); }
    };
    return html`<div class="modal-bg" onMouseDown=${(ev) => { if (ev.target === ev.currentTarget) onClose(); }}>
      <form class="tile static modal" onSubmit=${go} role="dialog" aria-modal="true" aria-labelledby="login-t">
        <div class="glow" style=${{ '--gc': 'var(--lime)' }}></div>
        <div class="modal-ico">${I.lock}</div>
        <h3 id="login-t" class="modal-t">Ingreso de administrador</h3>
        <p class="note" style=${{ marginTop: 0 }}>Para cargar o modificar datos. Cualquier persona con el enlace puede ver el tablero sin ingresar.</p>
        <div class="col">
          <${Fld} l="Usuario"><input ref=${ref} class="inp" autocomplete="username" value=${u} onInput=${(e) => setU(e.target.value)}/><//>
          <${Fld} l="Clave"><input class="inp" type="password" autocomplete="current-password" value=${p} onInput=${(e) => setP(e.target.value)}/><//>
          ${err ? html`<div class="warn">${err}</div>` : null}
          <div class="row" style=${{ justifyContent: 'flex-end', marginTop: 4 }}>
            <button type="button" class="btn" onClick=${onClose}>Cancelar</button>
            <button type="submit" class="btn btn-acc" disabled=${busy}>${busy ? 'Verificando…' : 'Ingresar'}</button>
          </div>
        </div>
      </form>
    </div>`;
  }

  function applyOps(data, ops) {
    const next = Object.assign({}, data);
    ops.forEach(({ op, col, id, data: obj }) => {
      next[col] = Object.assign({}, next[col]);
      if (op === 'put') next[col][id] = Object.assign({ id }, obj);
      else delete next[col][id];
    });
    return next;
  }

  /* ---------- Tema ---------- */
  function useTheme() {
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    const [pref, setPref] = useState(() => { try { return localStorage.getItem('pozos-gmp-tema'); } catch (e) { return null; } });
    const [sys, setSys] = useState(mq && mq.matches ? 'light' : 'dark');
    useEffect(() => {
      if (!mq) return;
      const f = (e) => setSys(e.matches ? 'light' : 'dark');
      mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f);
      return () => { mq.removeEventListener ? mq.removeEventListener('change', f) : mq.removeListener(f); };
    }, []);
    useEffect(() => {
      if (pref) document.documentElement.setAttribute('data-theme', pref);
      else document.documentElement.removeAttribute('data-theme');
    }, [pref]);
    const set = (t) => { setPref(t); try { localStorage.setItem('pozos-gmp-tema', t); } catch (e) { } };
    return [pref || sys, set];
  }

  /* ---------- Piezas chicas ---------- */
  const cls = (e) => /^Operativ/.test(e) ? 'ok' : e === 'Fuera de servicio' ? 'bad' : 'na';
  function Chip({ e, compact }) {
    return html`<span class=${'chip ' + cls(e.estado)}><i></i>${e.estado}${!compact && e.origen === 'planilla' ? html`<em> · planilla</em>` : null}</span>`;
  }
  function Inset({ l, v, children, style }) {
    return html`<div class="inset" style=${style}><div class="lbl">${l}</div>${v !== undefined ? html`<div class="v">${v}</div>` : null}${children}</div>`;
  }
  function Tile({ c, title, right, glow, children, cn }) {
    return html`<section class=${'tile ' + (c || 's12') + (cn ? ' ' + cn : '')}>
      ${glow ? html`<div class="glow" style=${{ '--gc': glow }}></div>` : null}
      ${title || right ? html`<div class="th"><h3>${title}</h3>${right}</div>` : null}
      ${children}
    </section>`;
  }
  function Fld({ l, children, full }) {
    return html`<label class=${'fld' + (full ? ' full' : '')}><span>${l}</span>${children}</label>`;
  }
  function ConfirmDel({ onYes }) {
    const [ask, setAsk] = useState(false);
    if (!ask) return html`<button class="btn btn-sm btn-ghost" title="Eliminar" onClick=${() => setAsk(true)}>✕</button>`;
    return html`<span class="confirm">¿Eliminar?
      <button class="btn btn-sm btn-danger" onClick=${() => { setAsk(false); onYes(); }}>Sí</button>
      <button class="btn btn-sm" onClick=${() => setAsk(false)}>No</button></span>`;
  }
  const glowOf = (e) => /^Operativ/.test(e.estado) ? 'var(--ok)' : e.estado === 'Fuera de servicio' ? 'var(--bad)' : 'var(--aqua)';
  const tooltipStyle = { background: 'var(--glass2)', border: '1px solid var(--stroke2)', borderRadius: 12, backdropFilter: 'blur(12px)', color: 'var(--fg)', fontSize: 12, boxShadow: 'var(--shadow)' };

  /* =========================================================
     01 · RESUMEN
     ========================================================= */
  function Resumen({ wells, data, est, openWell, pal }) {
    const total = wells.length;
    const ests = wells.map((w) => [w, est(w)]);
    const op = ests.filter(([, e]) => e.estado === 'Operativo').length;
    const fs = ests.filter(([, e]) => e.estado === 'Fuera de servicio').length;
    const cargados = wells.filter((w) => data.relevamiento[w.code] && data.relevamiento[w.code].estadoPozo).length;
    const fincas = U.groupBy(wells, U.fincaDe);
    const barData = fincas.map(([f, ws]) => ({ finca: f, op: ws.filter((w) => est(w).estado === 'Operativo').length, fs: ws.filter((w) => est(w).estado === 'Fuera de servicio').length }));
    const conFn = wells.filter((w) => { const f = data.funcion[w.code]; return f && (f.funcion || f.operacion || (f.destino && f.destino.length)); }).length;
    const acciones = U.sortAcciones(Object.values(data.bitacora)).slice(0, 5);
    const pct = total ? Math.round((op / total) * 100) : 0;
    const pieData = [{ name: 'Operativos', value: op, fill: 'url(#gOp)' }, { name: 'Fuera de servicio', value: fs, fill: 'url(#gFs)' }];
    if (total - op - fs > 0) pieData.push({ name: 'Sin dato', value: total - op - fs, fill: pal.na });

    return html`<div class="bento sec">
      <${Tile} c="s5 r2" title="Pozos relevados" glow="var(--aqua)" right=${html`<span class="chip plain mono">${cargados}/${total} con estado cargado</span>`}>
        <div class="donut">
          ${RC ? html`<${RC.ResponsiveContainer} width="100%" height="100%">
            <${RC.PieChart}>
              <defs>
                <linearGradient id="gOp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color=${pal.lime}/><stop offset="100%" stop-color=${pal.aqua}/></linearGradient>
                <linearGradient id="gFs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color=${pal.rose}/><stop offset="100%" stop-color=${pal.amber}/></linearGradient>
              </defs>
              <${RC.Pie} data=${pieData} dataKey="value" nameKey="name" innerRadius="68%" outerRadius="100%" paddingAngle=${4} cornerRadius=${10} stroke="none" startAngle=${90} endAngle=${-270} isAnimationActive=${true}>
                ${pieData.map((d) => html`<${RC.Cell} key=${d.name} fill=${d.fill}/>`)}
              <//>
              <${RC.Tooltip} contentStyle=${tooltipStyle} itemStyle=${{ color: 'var(--fg)' }}/>
            <//>
          <//>` : null}
          <div class="center"><div><div class="big">${total}</div><div class="lbl">pozos</div></div></div>
        </div>
        <div class="kv" style=${{ gridTemplateColumns: '1fr 1fr' }}>
          <${Inset} l="Operativos"><div class="disp" style=${{ fontSize: 28, fontWeight: 600, color: 'var(--ok)' }}>${op}</div><//>
          <${Inset} l="Fuera de servicio"><div class="disp" style=${{ fontSize: 28, fontWeight: 600, color: 'var(--bad)' }}>${fs}</div><//>
        </div>
        <p class="note" style=${{ marginBottom: 0 }}>Mientras un pozo no tenga relevamiento cargado, su estado es provisorio y se toma de la hoja POZOS DE AGUA (marca “planilla”).</p>
      <//>

      <${Tile} c="s4" title="Disponibilidad de pozos" glow="var(--lime)" right=${html`<span class="chip ok"><i></i>${op} de ${total} operativos</span>`}>
        <div class="pct-big"><span class="grad">${pct}</span><small class="grad">%</small></div>
        <div class="bar bar-lg"><i style=${{ width: pct + '%' }}></i>${[25, 50, 75].map((t) => html`<b key=${t} style=${{ left: t + '%' }}></b>`)}</div>
        <div class="row between" style=${{ marginTop: 8 }}><span class="lbl">0%</span><span class="lbl">${fs} fuera de servicio</span><span class="lbl">100%</span></div>
      <//>

      <${Tile} c="s3" title="Fuera de servicio" glow="var(--bad)">
        <div class="big" style=${{ color: 'var(--bad)' }}>${fs}</div>
        <div class="row" style=${{ marginTop: 14, gap: 6 }}>
          ${ests.filter(([, e]) => e.estado === 'Fuera de servicio').map(([w]) => html`<button key=${w.code} class="chip bad click" onClick=${() => openWell(w.code)}>${U.shortCode(w.code)}</button>`)}
          ${fs === 0 ? html`<span class="note">Ninguno 🎉</span>` : null}
        </div>
      <//>

      <${Tile} c="s7" title="Pozos por agrícola">
        <div style=${{ height: 220 }}>
          ${RC ? html`<${RC.ResponsiveContainer} width="100%" height="100%">
            <${RC.BarChart} data=${barData} margin=${{ top: 6, right: 6, left: -22, bottom: 0 }} barCategoryGap="28%">
              <defs>
                <linearGradient id="bOp" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color=${pal.aqua}/><stop offset="100%" stop-color=${pal.lime}/></linearGradient>
                <linearGradient id="bFs" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color=${pal.amber}/><stop offset="100%" stop-color=${pal.rose}/></linearGradient>
              </defs>
              <${RC.CartesianGrid} stroke=${pal.grid} vertical=${false}/>
              <${RC.XAxis} dataKey="finca" tick=${{ fill: pal.axis, fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }} axisLine=${false} tickLine=${false}/>
              <${RC.YAxis} allowDecimals=${false} tick=${{ fill: pal.axis, fontSize: 11 }} axisLine=${false} tickLine=${false}/>
              <${RC.Tooltip} cursor=${{ fill: pal.grid }} contentStyle=${tooltipStyle}/>
              <${RC.Legend} iconType="circle" wrapperStyle=${{ fontSize: 12 }}/>
              <${RC.Bar} dataKey="op" name="Operativos" stackId="a" fill="url(#bOp)" radius=${[0, 0, 8, 8]}/>
              <${RC.Bar} dataKey="fs" name="Fuera de servicio" stackId="a" fill="url(#bFs)" radius=${[8, 8, 0, 0]}/>
            <//>
          <//>` : null}
        </div>
      <//>

      <${Tile} c="s8" title="Pozos por sector" right=${html`<span class="chip plain mono">${conFn}/${total} con función descripta</span>`}>
        <div class="groups">
          ${fincas.map(([f, ws]) => html`<div class="inset" key=${f}>
            <div class="row between" style=${{ marginBottom: 6 }}><span class="lbl">${f}</span><span class="lbl">${ws.length}</span></div>
            ${ws.map((w) => html`<button key=${w.code} class="grp-row" onClick=${() => openWell(w.code)}>
              <span style=${{ minWidth: 0 }}><span class="mono" style=${{ fontSize: 12.5 }}>${w.code}</span><br/><span class="faint" style=${{ fontSize: 11.5 }}>${U.sectorDe(w)}</span></span>
              <${Chip} e=${est(w)} compact/>
            </button>`)}
          </div>`)}
        </div>
      <//>

      <${Tile} c="s4" title="Últimas acciones">
        ${acciones.length ? html`<div class="col">
          ${acciones.map((a) => html`<div class="log" key=${a.id}>
            <div class="lbl">${U.fmtF(a.fecha)} · ${U.shortCode(a.wellId || '')} · ${a.tipo}</div>
            <div class="t">${a.texto}</div>
          </div>`)}
        </div>` : html`<div class="empty">Todavía no hay acciones registradas.</div>`}
      <//>
    </div>`;
  }

  /* =========================================================
     02 · FICHA
     ========================================================= */
  function WellList({ wells, sel, setSel, est, showFilters }) {
    const [q, setQ] = useState('');
    const [ff, setFf] = useState('');
    const [fe, setFe] = useState('');
    const fincas = U.groupBy(wells, U.fincaDe).map(([f]) => f);
    const list = wells.filter((w) => {
      const s = (w.code + ' ' + w.agricola + ' ' + w.motor).toLowerCase();
      if (q && !s.includes(q.toLowerCase())) return false;
      if (ff && U.fincaDe(w) !== ff) return false;
      if (fe && est(w).estado !== fe) return false;
      return true;
    });
    return html`<div class="col">
      ${showFilters ? html`
        <input class="inp" placeholder="Buscar código, agrícola o motor…" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Buscar pozo"/>
        <div class="fgrid">
          <select class="inp" value=${ff} onChange=${(e) => setFf(e.target.value)} aria-label="Agrícola"><option value="">Todas</option>${fincas.map((f) => html`<option key=${f}>${f}</option>`)}</select>
          <select class="inp" value=${fe} onChange=${(e) => setFe(e.target.value)} aria-label="Estado"><option value="">Estado</option><option>Operativo</option><option>Fuera de servicio</option></select>
        </div>` : null}
      <div class="only-m">
        <select class="inp" value=${sel} onChange=${(e) => setSel(e.target.value)} aria-label="Pozo">
          ${(list.length ? list : wells).map((w) => html`<option key=${w.code} value=${w.code}>${w.code} · ${est(w).estado}</option>`)}
        </select>
      </div>
      <div class="list only-d">
        ${list.map((w) => { const e = est(w); return html`<button key=${w.code} class=${'well-row' + (w.code === sel ? ' sel' : '')} onClick=${() => setSel(w.code)}>
          <span class=${'dot ' + cls(e.estado)}></span>
          <span class="grow"><span class="c">${w.code}</span><br/><span class="a">${w.agricola} · ${e.estado}</span></span>
        </button>`; })}
        ${list.length === 0 ? html`<div class="empty">Sin resultados.</div>` : null}
      </div>
    </div>`;
  }

  function Ficha({ wells, sel, setSel, data, est, mutate, pal, onPdf, toast, canEdit, bombaDe, goBomba }) {
    const w = wells.find((x) => x.code === sel) || wells[0];
    const idx = wells.indexOf(w);
    const e = est(w);
    const pc = U.parseCode(w.code);
    const go = (d) => setSel(wells[(idx + d + wells.length) % wells.length].code);
    const [form, setForm] = useState(null); // null | 'nuevo' | 'editar'
    useEffect(() => { if (form === 'editar') setForm(null); }, [w.code]);
    useEffect(() => { if (!canEdit) setForm(null); }, [canEdit]);
    return html`<div class="split sec">
      <aside class="tile static side">
        <div class="th"><h3>Pozos</h3><div class="row" style=${{ gap: 8 }}><span class="lbl">${wells.length}</span>
          ${canEdit ? html`<button class="btn btn-sm btn-acc" onClick=${() => { setForm('nuevo'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>+ Nuevo pozo</button>` : null}</div></div>
        <${WellList} wells=${wells} sel=${w.code} setSel=${setSel} est=${est} showFilters/>
      </aside>
      <div class="bento">
        ${form && canEdit ? html`<${PozoForm} key=${form + (form === 'editar' ? w.code : '')} modo=${form} w=${form === 'editar' ? w : null} wells=${wells}
          mutate=${mutate} toast=${toast} onClose=${(code) => { setForm(null); if (code) setSel(code); }}/>` : null}
        <${Tile} c="s12" glow=${glowOf(e)}>
          <div class="row between" style=${{ alignItems: 'flex-start' }}>
            <div style=${{ minWidth: 0 }}>
              <div class="lbl">${w.agricola}</div>
              <h2 class="code-title">${w.code}</h2>
              <div style=${{ marginTop: 8 }}><${Chip} e=${e}/></div>
            </div>
            <div class="row">
              <div class="navbtns"><button class="btn" onClick=${() => go(-1)} aria-label="Pozo anterior">←</button>
              <span class="btn mono" style=${{ cursor: 'default' }}>${idx + 1} / ${wells.length}</span>
              <button class="btn" onClick=${() => go(1)} aria-label="Pozo siguiente">→</button></div>
              ${bombaDe && bombaDe(w.code) ? html`<button class="btn" onClick=${() => goBomba(bombaDe(w.code).code)} title="Ver la bomba instalada en este pozo">${I.pump} Ver bomba</button>` : null}
              <button class="btn btn-acc" onClick=${() => onPdf([w.code])}>${I.pdf} PDF del pozo</button>
            </div>
          </div>
          <div class="kv5" style=${{ marginTop: 16 }}>
            <${Inset} l="Finca" v=${pc.finca}/>
            <${Inset} l="Sector" v=${pc.sector || '—'}/>
            <${Inset} l="Equipo" v=${pc.equipo === 'BP' ? 'BP · bomba de pozo' : pc.equipo}/>
            <${Inset} l="Instalación" v=${pc.inst === 'S' ? 'S · sumergida' : (pc.inst || '—')}/>
            <${Inset} l="Potencia" v=${pc.hp ? pc.hp + ' HP' : '—'}/>
          </div>
        <//>

        <${Tile} c="s7" title="Equipo sumergido en el pozo" right=${canEdit ? html`<button class="btn btn-sm" onClick=${() => { setForm('editar'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>Editar datos</button>` : null}>
          <div class="kv">
            <${Inset} l="Motor" v=${w.motor || 's/d'}/>
            <${Inset} l="Bomba" v=${w.bomba || 's/d'}/>
            <${Inset} l="Potencia" v=${w.pot || '—'}/>
            <${Inset} l="Cañería" v=${w.caneria || '—'}/>
            <${Inset} l="Alimentación" v=${U.alimentacion(w.red)}/>
            <${Inset} l="Instalación" v=${pc.inst === 'S' ? 'Sumergida' : (pc.inst || '—')}/>
          </div>
        <//>

        <${Tile} c="s5" title="Ubicación">
          ${w.lat != null ? html`<a class="loc-link" href=${U.mapsUrl(w.lat, w.lon)} target="_blank" rel="noopener">
            <span class="loc-ico">${I.pin}</span>
            <span class="grow"><b>Ver en Google Maps</b><span class="note">${w.agricola}</span></span>
            <span class="loc-arrow">↗</span>
          </a>` : html`<div class="empty">Este pozo no tiene ubicación cargada en la hoja.</div>`}
        <//>

        <${EstadoTile} canEdit=${canEdit} w=${w} data=${data} e=${e} mutate=${mutate} toast=${toast}/>
        <${NivelesTile} w=${w} data=${data} pal=${pal}/>
        <${FuncionTile} canEdit=${canEdit} w=${w} data=${data} mutate=${mutate} toast=${toast}/>
        <${TrazTile} canEdit=${canEdit} w=${w} data=${data} mutate=${mutate} toast=${toast}/>
        <${AdjTile} canEdit=${canEdit} w=${w} data=${data} mutate=${mutate} toast=${toast}/>
      </div>
    </div>`;
  }

  const ESTADOS_HOJA = ['Operativo', 'Fuera de servicio'];
  function PozoForm({ modo, w, wells, mutate, toast, onClose }) {
    const nuevo = modo === 'nuevo';
    const lim = (v) => (v == null || v === '—' || v === 's/d') ? '' : String(v);
    const [f, setF] = useState(() => ({
      code: nuevo ? '' : w.code, agricola: nuevo ? '' : lim(w.agricola), gms: nuevo ? '' : lim(w.gms),
      motor: nuevo ? '' : lim(w.motor), bomba: nuevo ? '' : lim(w.bomba), pot: nuevo ? '' : lim(w.pot),
      caneria: nuevo ? '' : lim(w.caneria), estadoPlanilla: nuevo ? 'Operativo' : (U.normEstado(w.estadoPlanilla) === 's/d' ? 'Operativo' : U.normEstado(w.estadoPlanilla)),
      obs: nuevo ? '' : lim(w.obs)
    }));
    const [busy, setBusy] = useState(false);
    const set = (k) => (ev) => setF(Object.assign({}, f, { [k]: ev.target.value }));
    const code = U.normCode(f.code);
    const ll = U.parseGMS(f.gms);
    const dup = nuevo && code && wells.some((x) => x.code === code);
    const pc = U.parseCode(code);
    const save = async () => {
      if (!code) return toast('Poné el código del pozo.', 'bad');
      if (dup) return toast('Ya existe un pozo con ese código.', 'bad');
      if (!f.agricola.trim()) return toast('Poné la agrícola.', 'bad');
      if (f.gms.trim() && !ll) return toast('No entiendo la ubicación. Usá 27° 6\' 8.9" S 65° 34\' 23.4" W', 'bad');
      setBusy(true);
      const d = { code, agricola: f.agricola.trim().toUpperCase(), gms: f.gms.trim(), motor: f.motor.trim() || 's/d', bomba: f.bomba.trim() || 's/d',
        pot: f.pot.trim() || '—', caneria: f.caneria.trim() || '—', estadoPlanilla: f.estadoPlanilla, obs: f.obs.trim(), updatedAt: new Date().toISOString() };
      const ok = await mutate([{ op: 'put', col: 'pozos', id: code, data: d }]);
      setBusy(false);
      if (ok) { toast(nuevo ? 'Pozo agregado a la hoja.' : 'Datos del pozo guardados.'); onClose(code); }
    };
    return html`<${Tile} c="s12" cn="static" glow="var(--lime)" title=${nuevo ? 'Nuevo pozo' : 'Editar datos del pozo'}
      right=${html`<span class="lbl">Se guarda en Ingeniería GMP › POZOS DE AGUA</span>`}>
      <div class="fgrid" style=${{ gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))' }}>
        <${Fld} l="Código de equipo *"><input class="inp mono" value=${f.code} disabled=${!nuevo} onInput=${set('code')} placeholder="FINCA-SECTOR-BP-S-HP"/><//>
        <${Fld} l="Agrícola *"><input class="inp" value=${f.agricola} onInput=${set('agricola')} placeholder="TDA - FINCA"/><//>
        <${Fld} l="Estado actual"><select class="inp" value=${f.estadoPlanilla} onChange=${set('estadoPlanilla')}>${ESTADOS_HOJA.map((x) => html`<option key=${x}>${x}</option>`)}</select><//>
        <${Fld} l="Ubicación (grados, minutos, segundos)"><input class="inp mono" value=${f.gms} onInput=${set('gms')} placeholder=${'27° 6\' 8.9" S 65° 34\' 23.4" W'}/><//>
        <${Fld} l="Motor"><input class="inp" value=${f.motor} onInput=${set('motor')} placeholder="Franklin Electric 40"/><//>
        <${Fld} l="Bomba"><input class="inp" value=${f.bomba} onInput=${set('bomba')}/><//>
        <${Fld} l="Potencia"><input class="inp" value=${f.pot} onInput=${set('pot')} placeholder="40 HP"/><//>
        <${Fld} l="Cant. caños y diámetro"><input class="inp" value=${f.caneria} onInput=${set('caneria')} placeholder='9 caños de 2"'/><//>

  function SatMap({ w, e, pal }) {
    const el = useRef(null);
    const mapRef = useRef(null);
    const mkRef = useRef(null);
    const color = e.estado === 'Operativo' ? pal.ok : e.estado === 'Fuera de servicio' ? pal.bad : pal.na;
    useEffect(() => {
      if (!window.L || !el.current) return;
      const map = L.map(el.current, { zoomControl: false, attributionControl: false, maxZoom: 19, minZoom: 3, zoomSnap: 0.5 });
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18 }).addTo(map);
      mapRef.current = map;
      const t = setTimeout(() => map.invalidateSize(), 120);
      return () => { clearTimeout(t); map.remove(); mapRef.current = null; mkRef.current = null; };
    }, []);
    useEffect(() => {
      const map = mapRef.current;
      if (!map || w.lat == null) return;
      const icon = L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="pin" style="--c:${color}"><div class="p"></div><b>${U.esc(U.shortCode(w.code))}</b></div>` });
      if (mkRef.current) mkRef.current.setLatLng([w.lat, w.lon]).setIcon(icon);
      else mkRef.current = L.marker([w.lat, w.lon], { icon, keyboard: false }).addTo(map);
      map.setView([w.lat, w.lon], 17, { animate: false });
    }, [w.code, color]);
    if (!window.L) return html`<div class="mapbox"><div class="map-msg">No se pudo cargar el mapa (Leaflet). Revisá la conexión a internet.</div></div>`;
    const zoom = (d) => mapRef.current && mapRef.current.setZoom(mapRef.current.getZoom() + d);
    const center = () => mapRef.current && w.lat != null && mapRef.current.setView([w.lat, w.lon], 17);
    return html`<div class="mapbox">
      <div ref=${el} style=${{ position: 'absolute', inset: 0 }}></div>
      ${w.lat == null ? html`<div class="map-msg" style=${{ zIndex: 460, background: 'rgba(5,7,10,.7)' }}>Este pozo todavía no tiene coordenadas cargadas en la planilla.</div>` : null}
      <div class="map-ctl">
        <button onClick=${() => zoom(1)} aria-label="Acercar">+</button>
        <button onClick=${() => zoom(-1)} aria-label="Alejar">−</button>
        <button class="w" onClick=${center}>Centrar</button>
      </div>
      <div class="map-credit">Imagen satelital: Esri, Maxar, Earthstar Geographics</div>
    </div>`;
  }

  const BTABS = [
    { id: 'resumen', n: '01', t: 'Resumen' },
    { id: 'ficha', n: '02', t: 'Ficha de bombas' },
    { id: 'mant', n: '03', t: 'Mantenimientos' },
    { id: 'informe', n: '04', t: 'Informe' }
  ];
  const G = { html, useState, useEffect, useMemo, useRef, RC, I, Tile, Inset, Fld, ConfirmDel, tooltipStyle, U };
  const B = window.crearModuloBombas ? window.crearModuloBombas(G) : null;

  // Aplica en pantalla, al instante, lo que se manda a las hojas de bombas.
  function applyB(st, ops) {
    let bombas = (st.bombas || []).slice();
    let mants = (st.mants || []).slice();
    ops.forEach((o) => {
      const d = Object.assign({}, o.data || {});
      if (o.col === 'bombas') {
        const k = U.normCode(o.id);
        const i = bombas.findIndex((r) => U.normCode(r.codigo) === k);
        if (i >= 0) bombas[i] = Object.assign({}, bombas[i], d);
        else bombas.push(Object.assign({ codigo: o.id }, d));
      }
      if (o.col === 'mant') {
        const key = d.key;
        delete d.key;
        if (d.fecha) d.fecha = U.isoAR(d.fecha);
        if (o.op === 'del') mants = mants.filter((r) => !key || r.key.hash !== key.hash);
        else if (key) mants = mants.map((r) => (r.key.hash === key.hash ? Object.assign({}, r, d) : r));
        else mants.unshift(Object.assign({ key: { fila: 0, hash: 'nuevo-' + U.uid() } }, d));
      }
    });
    return { bombas, mants };
  }
