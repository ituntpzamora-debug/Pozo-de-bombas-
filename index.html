  /* =========================================================
     APP
     ========================================================= */
  function leerHash() {
    const [m, t] = location.hash.slice(1).split('/');
    if (m === 'pozos') return { mod: 'pozos', tab: TABS.some((x) => x.id === t) ? t : 'resumen', btab: 'resumen' };
    if (m === 'bombas' && B) return { mod: 'bombas', tab: 'resumen', btab: BTABS.some((x) => x.id === t) ? t : 'resumen' };
    if (TABS.some((x) => x.id === m)) return { mod: 'pozos', tab: m, btab: 'resumen' };   // enlaces viejos (#ficha)
    return { mod: 'inicio', tab: 'resumen', btab: 'resumen' };
  }

  function App() {
    const [theme, setTheme] = useTheme();
    const pal = PAL[theme];
    const h0 = useMemo(leerHash, []);
    const [mod, setMod] = useState(h0.mod);
    const [tab, setTab] = useState(h0.tab);
    const [btab, setBtab] = useState(h0.btab);
    const [data, setData] = useState(U.normalizeData(null));
    const [registro, setRegistro] = useState(null);
    const [rawB, setRawB] = useState(() => (window.BOMBAS_BASE ? { bombas: window.BOMBAS_BASE.bombas, mants: window.BOMBAS_BASE.mants } : { bombas: [], mants: [] }));
    const [bSrc, setBSrc] = useState('copia');
    const [planilla, setPlanilla] = useState(null);
    const [loaded, setLoaded] = useState(false);
    const [srcState, setSrcState] = useState(store.mode === 'sheets' ? 'cargando' : 'local');
    const [toastMsg, setToastMsg] = useState(null);
    const [logoUrl, setLogoUrl] = useState(null);
    const [admin, setAdmin] = useState(() => (store.mode === 'sheets' ? leerSesion() : null));
    const [showLogin, setShowLogin] = useState(false);
    const canEdit = store.mode === 'local' || !!admin;
    const adminRef = useRef(admin);
    adminRef.current = admin;
    const dataRef = useRef(data);
    dataRef.current = data;
    const rawBRef = useRef(rawB);
    rawBRef.current = rawB;

    const toast = useCallback((m, k) => { setToastMsg({ m, k: k || 'ok', t: Date.now() }); }, []);
    useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(null), 3600); return () => clearTimeout(t); }, [toastMsg]);

    const wells = useMemo(() => U.buildWells(window.POZOS_BASE || [], CFG.EXTRA_WELLS || [], registro, data.pozos), [registro, data.pozos]);
    const bombas = useMemo(() => U.buildBombas(rawB.bombas), [rawB.bombas]);
    const mants = useMemo(() => U.buildMants(rawB.mants, bombas), [rawB.mants, bombas]);
    const [sel, setSel] = useState(() => (wells[0] || {}).code);
    const [selB, setSelB] = useState(() => (bombas[0] || {}).code);

    const est = useCallback((w) => {
      const r = data.relevamiento[w.code];
      if (r && r.estadoPozo) return { estado: r.estadoPozo, origen: 'relevamiento', fecha: r.fecha };
      return { estado: U.normEstado(w.estadoPlanilla), origen: 'planilla' };
    }, [data]);

    const load = useCallback(async (silencioso) => {
      if (!silencioso) setSrcState(store.mode === 'sheets' ? 'cargando' : 'local');
      try {
        const r = await store.load();
        setData(r.data);
        if (r.registro) setRegistro(r.registro);
        if (r.planilla) setPlanilla(r.planilla);
        if (r.bombas || r.mants) {
          setRawB((prev) => ({ bombas: r.bombas || prev.bombas, mants: r.mants || prev.mants }));
          setBSrc(store.mode === 'sheets' && r.bombas && r.mants ? 'vivo' : store.mode === 'local' ? 'local' : 'copia');
        } else if (store.mode === 'sheets' && !silencioso) {
          toast('No pude leer las hojas de bombas: actualizá el Apps Script (ver instrucciones). Se muestra la copia del 11/11.', 'bad');
        }
        setSrcState(store.mode === 'sheets' ? 'ok' : 'local');
      } catch (err) {
        console.error(err);
        const c = lsGet(LS_CACHE);
        if (c) {
          setData(U.normalizeData(c.data));
          if (c.registro) setRegistro(c.registro);
          if (c.bombas) setRawB({ bombas: c.bombas, mants: c.mants || [] });
        }
        setSrcState('error');
        toast('No se pudo leer Google Sheets' + (c ? '; se muestra la última copia guardada.' : '.'), 'bad');
      }
      setLoaded(true);
    }, []);
    useEffect(() => { load(); }, []);
    useEffect(() => { if (loaded && store.mode === 'local') lsSet(LS_DATA, { pozos: data, bombas: rawB.bombas, mants: rawB.mants }); }, [data, rawB, loaded]);
    useEffect(() => { U.loadLogo().then((l) => l && setLogoUrl(l.url)); }, []);
    useEffect(() => {
      const h = mod === 'inicio' ? '#inicio' : '#' + mod + '/' + (mod === 'pozos' ? tab : btab);
      if (location.hash !== h) history.replaceState(null, '', h);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, [mod, tab, btab]);

    const authFail = (err) => {
      if (err.auth) { borrarSesion(); setAdmin(null); toast('Tu sesión de administrador venció. Ingresá de nuevo para guardar.', 'bad'); }
      else toast('No se pudo guardar: ' + err.message, 'bad');
    };
    const mutate = useCallback(async (ops) => {
      const prev = dataRef.current;
      setData(applyOps(prev, ops));
      try { await store.bulk(ops, adminRef.current && adminRef.current.session); return true; } catch (err) {
        console.error(err); setData(prev); authFail(err); return false;
      }
    }, []);
    // Bombas: se escribe en las hojas y después se vuelve a leer, para quedar igual que la planilla.
    const mutateB = useCallback(async (ops) => {
      const prev = rawBRef.current;
      setRawB(applyB(prev, ops));
      try {
        await store.bulk(ops, adminRef.current && adminRef.current.session);
        if (store.mode === 'sheets') load(true);
        return true;
      } catch (err) { console.error(err); setRawB(prev); authFail(err); return false; }
    }, []);
    useEffect(() => {
      if (!admin || store.mode !== 'sheets') return;
      store.check(admin.session).catch((e) => { if (e.auth) { borrarSesion(); setAdmin(null); } });
    }, []);
    useEffect(() => {
      if (!admin) return;
      const t = setTimeout(() => { borrarSesion(); setAdmin(null); toast('Tu sesión de administrador venció.', 'bad'); }, Math.min(2147483000, Math.max(0, admin.exp - Date.now())));
      return () => clearTimeout(t);
    }, [admin]);
    const onLogin = (s) => { lsSet(LS_ADMIN, s); setAdmin(s); setShowLogin(false); toast('Hola, ' + s.user + '. Ya podés cargar y modificar datos.'); };
    const logout = () => { borrarSesion(); setAdmin(null); toast('Sesión cerrada. Quedaste en modo lectura.'); };

    const tabs = mod === 'bombas' ? BTABS : TABS;
    const curTab = mod === 'bombas' ? btab : tab;
    const setCur = mod === 'bombas' ? setBtab : setTab;
    const step = (d) => { const i = tabs.findIndex((t) => t.id === curTab); setCur(tabs[(i + d + tabs.length) % tabs.length].id); };
    useEffect(() => {
      const f = (ev) => {
        if (mod === 'inicio') return;
        const tg = ev.target;
        if (tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable)) return;
        if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
        if (ev.key === 'ArrowRight') step(1);
        if (ev.key === 'ArrowLeft') step(-1);
      };
      window.addEventListener('keydown', f);
      return () => window.removeEventListener('keydown', f);
    });

    const openWell = (code) => { setSel(code); setTab('ficha'); setMod('pozos'); };
    const openB = (code) => { setSelB(code); setBtab('ficha'); setMod('bombas'); };
    // Bomba de pozo <-> pozo: mismo código, o misma finca + "BP".
    const bombaDe = (code) => bombas.find((b) => b.tipo === 'BP' && (b.code === code || U.claveBomba(b.code) === U.claveBomba(code))) || null;
    const pozoDe = (code) => { const b = bombas.find((x) => x.code === code); if (!b || b.tipo !== 'BP') return null; return wells.find((w) => w.code === code || U.claveBomba(w.code) === U.claveBomba(code)) || null; };
    const onPdf = async (codes) => {
      try { await window.PozosPDF.generar(codes, { wells, data: dataRef.current, est }); }
      catch (err) { console.error(err); toast('No se pudo generar el PDF: ' + err.message, 'bad'); }
    };
    const onPdfB = async (codes) => {
      try { await window.BombasPDF.generar(codes, { bombas, mants }); }
      catch (err) { console.error(err); toast('No se pudo generar el PDF: ' + err.message, 'bad'); }
    };

    const exportJSON = () => {
      const blob = new Blob([JSON.stringify({ exportado: new Date().toISOString(), data: dataRef.current }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pozos-gmp-datos-' + U.hoy() + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    const fileRef = useRef(null);
    const importJSON = async (ev) => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      try {
        const j = JSON.parse(await file.text());
        const inc = U.normalizeData(j.data || j);
        const ops = [];
        Object.keys(inc).forEach((col) => Object.keys(inc[col]).forEach((id) => ops.push({ op: 'put', col, id, data: inc[col][id] })));
        if (!ops.length) return toast('El archivo no tiene datos.', 'bad');
        const ok = await mutate(ops);
        if (ok) toast(`Importados ${ops.length} registros.`);
      } catch (err) { toast('Archivo inválido: ' + err.message, 'bad'); }
    };

    if (!wells.length) return html`<div class="boot">No hay pozos cargados.</div>`;
    const selW = wells.some((w) => w.code === sel) ? sel : wells[0].code;
    const selBB = bombas.some((b) => b.code === selB) ? selB : (bombas[0] || {}).code;

    const sheetUrl = (planilla && planilla.url) || CFG.SHEET_URL;
    const sheetName = (planilla && planilla.nombre) || 'Ingeniería GMP';
    const vivo = srcState === 'ok' ? ' · en vivo' : (CFG.DATOS_AL ? ' · copia al ' + CFG.DATOS_AL : '');
    const srcLabel = { local: 'Datos: este navegador', cargando: 'Datos: conectando…', ok: 'Datos: Google Sheets', error: 'Datos: sin conexión' }[srcState];
    const srcDot = { local: 'na', cargando: 'na', ok: 'ok', error: 'bad' }[srcState];

    const titulo = mod === 'pozos' ? html`Pozos de agua <span class="grad">profunda</span>`
      : mod === 'bombas' ? html`Bombas de <span class="grad">agua</span>`
      : html`Mantenimiento área de <span class="grad">Ingeniería</span>`;
    const sub = mod === 'pozos' ? html`${wells.length} pozos de <a href=${sheetUrl} target="_blank" rel="noopener">${sheetName} › POZOS DE AGUA</a>${vivo}`
      : mod === 'bombas' ? html`${bombas.length} bombas de <a href=${sheetUrl} target="_blank" rel="noopener">${sheetName} › Registro BOMBA</a>${bSrc === 'vivo' ? ' · en vivo' : bSrc === 'local' ? '' : ' · copia del 11/11/2026'}`
      : html`Seguimiento del estado y los mantenimientos de los equipos del Grupo MP · <a href=${sheetUrl} target="_blank" rel="noopener">${sheetName}</a>${vivo}`;

    return html`<div class="wrap">
      <header class="hdr">
        <div class="brand">
          <button class="plate plate-btn" onClick=${() => setMod('inicio')} title="Menú principal">${logoUrl ? html`<img src=${logoUrl} alt="Grupo MP"/>` : html`<b>GMP</b>`}</button>
          <div style=${{ minWidth: 0 }}>
            <div class="eyebrow">${mod === 'inicio' ? 'Grupo MP · Ingeniería' : 'Mantenimiento · Ingeniería · Grupo MP'}</div>
            <h1 class="h1">${titulo}</h1>
            <div class="sub">${sub}</div>
          </div>
        </div>
        <div class="hdr-r">
          <div class="seg" role="group" aria-label="Tema">
            <button class=${theme === 'light' ? 'on' : ''} onClick=${() => setTheme('light')}>${I.sun} Claro</button>
            <button class=${theme === 'dark' ? 'on' : ''} onClick=${() => setTheme('dark')}>${I.moon} Oscuro</button>
          </div>
          ${mod !== 'inicio' ? html`<div class="navbtns"><button class="btn" onClick=${() => step(-1)}>← Anterior</button><button class="btn" onClick=${() => step(1)}>Siguiente →</button></div>` : null}
          ${store.mode === 'sheets' ? (admin
            ? html`<div class="admin-pill"><span class="dot ok"></span>${I.user}<span>${admin.user}</span><button class="btn btn-sm" onClick=${logout}>Salir</button></div>`
            : html`<button class="btn" onClick=${() => setShowLogin(true)}>${I.lock} Ingresar</button>`) : null}
        </div>
      </header>

      ${mod !== 'inicio' ? html`<nav class="tabs" role="tablist">
        <button class="tab tab-home" onClick=${() => setMod('inicio')} title="Volver al menú principal">${I.home}<span>Menú</span></button>
        <button class="tab tab-switch" onClick=${() => setMod(mod === 'pozos' ? 'bombas' : 'pozos')} title=${mod === 'pozos' ? 'Ir a Bombas' : 'Ir a Pozos'}>${mod === 'pozos' ? I.pump : I.drop}<span>${mod === 'pozos' ? 'Bombas' : 'Pozos'}</span></button>
        <span class="tab-sep"></span>
        ${tabs.map((t) => html`<button key=${t.id} role="tab" aria-selected=${t.id === curTab} class=${'tab' + (t.id === curTab ? ' on' : '')} onClick=${() => setCur(t.id)}><span class="n">${t.n}</span>${t.t}</button>`)}
      </nav>` : null}

      <main key=${mod + '/' + curTab}>
        ${mod === 'inicio' ? html`<${Home} wells=${wells} est=${est} data=${data} bombas=${bombas} mants=${mants} goMod=${setMod} openWell=${openWell} openB=${openB}/>` : null}
        ${mod === 'pozos' && tab === 'resumen' ? html`<${Resumen} wells=${wells} data=${data} est=${est} openWell=${openWell} pal=${pal}/>` : null}
        ${mod === 'pozos' && tab === 'ficha' ? html`<${Ficha} canEdit=${canEdit} wells=${wells} sel=${selW} setSel=${setSel} data=${data} est=${est} mutate=${mutate} pal=${pal} onPdf=${onPdf} toast=${toast} bombaDe=${bombaDe} goBomba=${openB}/>` : null}
        ${mod === 'pozos' && tab === 'mapa' ? html`<${Mapa} wells=${wells} sel=${selW} setSel=${setSel} est=${est} goFicha=${openWell} pal=${pal}/>` : null}
        ${mod === 'pozos' && tab === 'informe' ? html`<${Informe} wells=${wells} data=${data} est=${est} openWell=${openWell} onPdf=${onPdf} logoUrl=${logoUrl}/>` : null}
        ${mod === 'bombas' && !bombas.length ? html`<div class="empty">No hay bombas cargadas en la hoja Registro BOMBA.</div>` : null}
        ${mod === 'bombas' && bombas.length && btab === 'resumen' ? html`<${B.ResumenB} bombas=${bombas} mants=${mants} openB=${openB} pal=${pal} goTab=${setBtab}/>` : null}
        ${mod === 'bombas' && bombas.length && btab === 'ficha' ? html`<${B.FichaB} bombas=${bombas} mants=${mants} sel=${selBB} setSel=${setSelB} canEdit=${canEdit} mutateB=${mutateB} toast=${toast} onPdf=${onPdfB} pozoDe=${pozoDe} goPozo=${openWell}/>` : null}
        ${mod === 'bombas' && bombas.length && btab === 'mant' ? html`<${B.MantsTab} bombas=${bombas} mants=${mants} canEdit=${canEdit} mutateB=${mutateB} toast=${toast} openB=${openB} pal=${pal}/>` : null}
        ${mod === 'bombas' && bombas.length && btab === 'informe' ? html`<${B.InformeB} bombas=${bombas} mants=${mants} openB=${openB} onPdf=${onPdfB} logoUrl=${logoUrl}/>` : null}
      </main>

      <footer class="ftr">
        ${mod !== 'inicio' ? html`<span><kbd>←</kbd> <kbd>→</kbd> para avanzar entre secciones</span>` : html`<span>Elegí un módulo para empezar</span>`}
        <span>${mod === 'bombas' ? 'FINCA-SECTOR-TIPO-INSTALACIÓN-HP · BP pozo · BH antiheladas · BR riego · BF fertirriego · BB booster · S sumergida · C centrífuga'
          : mod === 'pozos' ? 'FINCA-SECTOR-BP-INSTALACIÓN-HP · BP = bomba de pozo · S = sumergida' : 'Grupo MP · Ingeniería'}</span>
        <span class="tools">
          <span class="badge-src"><span class=${'dot ' + srcDot}></span>${srcLabel}</span>
          ${store.mode === 'sheets' ? html`<button class="btn btn-sm" onClick=${() => load()} title="Volver a leer la planilla">${I.refresh} Recargar</button>` : null}
          ${canEdit && mod === 'pozos' ? html`<button class="btn btn-sm" onClick=${exportJSON}>Exportar JSON</button>
          <button class="btn btn-sm" onClick=${() => fileRef.current && fileRef.current.click()}>Importar JSON</button>
          <input ref=${fileRef} type="file" accept="application/json,.json" class="sr" onChange=${importJSON}/>` : null}
          ${!canEdit ? html`<span class="badge-src">${I.lock} Modo lectura</span>` : null}
        </span>
      </footer>
      ${showLogin ? html`<${LoginModal} onClose=${() => setShowLogin(false)} onOk=${onLogin}/>` : null}
      ${toastMsg ? html`<div class=${'toast ' + toastMsg.k} role="status" key=${toastMsg.t}>${toastMsg.m}</div>` : null}
    </div>`;
  }

  /* ---------- Arranque ---------- */
  const root = document.getElementById('root');
  if (!window.React || !window.ReactDOM || !window.htm) {
    root.innerHTML = '<div class="boot">No se pudieron cargar las librerías. Revisá la conexión a internet y recargá.</div>';
    return;
  }
  ReactDOM.createRoot(root).render(html`<${App}/>`);
})();

</script>
</body>
</html>
