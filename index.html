<script>
/* ---- js/pdf-bombas.js ---- */
/* Informe PDF de BOMBAS — jsPDF + jspdf-autotable, A4 en mm
   Portada: indicadores, bombas por agrícola, trabajos en proceso, situación por bomba e inversión.
   Después, una ficha por bomba con su historial de mantenimientos. */
window.BombasPDF = (function () {
  'use strict';
  const U = window.PozosUtil;

  const DK = [14, 38, 30], DK2 = [24, 58, 46], LIME = [198, 246, 91], OL = [79, 125, 0], TEAL = [11, 133, 121];
  const OK = [17, 133, 90], OK_S = [226, 243, 235], BAD = [201, 47, 67], BAD_S = [251, 230, 233], NA = [110, 122, 116], NA_S = [236, 239, 237];
  const AMB = [167, 98, 0], AMB_S = [253, 244, 226];
  const INK = [16, 26, 22], GR = [104, 116, 110], LINE = [219, 226, 222], PAPER = [245, 248, 246], WHITE = [255, 255, 255];
  const PW = 210, PH = 297, M = 14, CW = PW - 2 * M;
  const TOP = 38, TOP_BAND = 66, BOTTOM = 276;

  const T = (x) => String(x == null ? '' : x)
    .replace(/[—–]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/[↗→]/g, '>').replace(/←/g, '<')
    .replace(/[^\x00-\xFF]/g, '');
  const colEstado = (e) => /^Operativ/.test(e) ? [OK, OK_S] : e === 'Fuera de servicio' ? [BAD, BAD_S] : [NA, NA_S];
  const colTrabajo = (t) => t === 'Finalizado' ? [OK, OK_S] : t === 'En proceso' ? [AMB, AMB_S] : [NA, NA_S];
  const usdTxt = (n) => (n == null ? '-' : 'USD ' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 0 }));
  const fechaDe = (m) => (m.fecha ? U.fmtF(m.fecha) : (m.fechaTxt || '-'));

  function build(codes, ctx, logo, pageOf) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const bombas = codes.map((c) => ctx.bombas.find((b) => b.code === c)).filter(Boolean);
    const set = new Set(bombas.map((b) => b.code));
    const mants = ctx.mants.filter((m) => m.code && set.has(m.code));
    const msDe = (c) => mants.filter((m) => m.code === c);
    const multi = bombas.length > 1;
    const hoy = U.fmtF(U.hoy());
    const titles = {}, starts = {};
    let cur = { t: '', s: '' };
    let y = TOP_BAND;

    const font = (style, size, color) => { doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...(color || INK)); };
    const lh = (size) => size * 0.3528 * 1.28;
    const mark = () => { titles[doc.getNumberOfPages()] = Object.assign({}, cur); };
    const newPage = () => { doc.addPage(); mark(); y = TOP; };
    const ensure = (h) => { if (y + h > BOTTOM) newPage(); };
    const box = (x, yy, w, h, fill, stroke, r) => {
      doc.setLineWidth(0.25);
      if (fill) doc.setFillColor(...fill);
      if (stroke) doc.setDrawColor(...stroke);
      doc.roundedRect(x, yy, w, h, r == null ? 2.6 : r, r == null ? 2.6 : r, fill && stroke ? 'FD' : fill ? 'F' : 'S');
    };
    const pill = (x, yy, txt, fg, bg, size) => {
      size = size || 7;
      font('bold', size, fg);
      const t = T(txt).toUpperCase();
      const w = doc.getTextWidth(t) + 7, h = size * 0.62 + 1.6;
      box(x, yy, w, h, bg, null, h / 2);
      doc.setFillColor(...fg); doc.circle(x + 2.6, yy + h / 2, 0.8, 'F');
      doc.text(t, x + 4.4, yy + h / 2 + size * 0.125);
      return w;
    };
    const wrap = (txt, w, size) => { doc.setFontSize(size); return doc.splitTextToSize(T(txt || '-'), w); };
    const sectionTitle = (n, txt, need) => {
      ensure(9 + (need || 16));
      doc.setFillColor(...OL); doc.roundedRect(M, y, 5.2, 5.2, 1, 1, 'F');
      font('bold', 7.5, WHITE); doc.text(String(n), M + 2.6, y + 3.7, { align: 'center' });
      font('bold', 9.5, INK); doc.text(T(txt).toUpperCase(), M + 7.6, y + 3.9);
      const tw = doc.getTextWidth(T(txt).toUpperCase());
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M + 10 + tw, y + 2.6, PW - M, y + 2.6);
      y += 8.5;
    };
    const cardTitle = (x, yy, txt) => { font('bold', 7.2, OL); doc.text(T(txt).toUpperCase(), x + 4.5, yy + 6.2); };
    const kv = (x, yy, w, rows, draw, labW) => {
      labW = labW || 30;
      let h = 0;
      rows.forEach(([k, val]) => {
        const lines = wrap(val, w - labW, 8.6);
        const rh = Math.max(1, lines.length) * lh(8.6) + 2.4;
        if (draw) {
          font('normal', 7, GR); doc.text(T(k).toUpperCase(), x, yy + h + 3.1);
          font('normal', 8.6, INK); doc.text(lines, x + labW, yy + h + 3.2);
          doc.setDrawColor(...LINE); doc.setLineWidth(0.15); doc.line(x, yy + h + rh - 0.6, x + w, yy + h + rh - 0.6);
        }
        h += rh;
      });
      return h;
    };
    const table = (head, body, opts) => {
      ensure(10 + Math.min(body.length, 4) * 7.6);
      doc.autoTable(Object.assign({
        startY: y, head: head ? [head] : undefined, body,
        margin: { top: TOP, left: M, right: M, bottom: PH - BOTTOM },
        theme: 'striped',
        styles: { font: 'helvetica', fontSize: 8.2, cellPadding: { top: 2.2, bottom: 2.2, left: 2.4, right: 2.4 }, textColor: INK, overflow: 'linebreak', valign: 'middle' },
        headStyles: { fillColor: DK2, textColor: WHITE, fontStyle: 'bold', fontSize: 7.4 },
        alternateRowStyles: { fillColor: PAPER },
        didDrawPage: () => { if (!titles[doc.getNumberOfPages()]) mark(); },
        didDrawCell: (d) => {
          const raw = d.cell.raw;
          if (d.section !== 'body' || !raw || typeof raw !== 'object') return;
          if (raw.page) doc.link(d.row.cells[0].x, d.cell.y, CW, d.cell.height, { pageNumber: raw.page });
          if (raw.estado || raw.trabajo) {
            const [fg, bg] = raw.estado ? colEstado(raw.estado) : colTrabajo(raw.trabajo);
            pill(d.cell.x + 2, d.cell.y + d.cell.height / 2 - 2.6, raw.estado || raw.trabajo, fg, bg, 6.2);
          }
        }
      }, opts || {}));
      y = doc.lastAutoTable.finalY + 7;
    };
    const vacio = (txt) => { ensure(14); box(M, y, CW, 11, PAPER, LINE); font('normal', 8.4, GR); doc.text(T(txt), M + 5, y + 7); y += 15; };

    /* =========================== PORTADA =========================== */
    if (multi) {
      cur = { t: 'Estado de bombas de agua', s: `Informe al ${hoy}` };
      mark();
      const op = bombas.filter((b) => b.estado === 'Operativa').length;
      const fs = bombas.filter((b) => b.estado === 'Fuera de servicio').length;
      const pct = bombas.length ? Math.round((op / bombas.length) * 100) : 0;
      const tipos = U.groupBy(bombas, U.fincaDe);
      const enProc = mants.filter((m) => m.trabajo === 'En proceso');

      const kw = (CW - 3 * 4) / 4, kh = 27;
      [['Bombas incluidas', String(bombas.length), INK, `${tipos.length} agrícola${tipos.length === 1 ? '' : 's'}`],
        ['Operativas', String(op), OK, 'en servicio'], ['Fuera de servicio', String(fs), BAD, `${enProc.length} trabajo${enProc.length === 1 ? '' : 's'} en proceso`], ['Disponibilidad', pct + '%', OL, null]]
        .forEach(([l, n, c, sub], i) => {
          const x = M + i * (kw + 4);
          box(x, y, kw, kh, i === 3 ? [241, 248, 228] : PAPER, LINE);
          doc.setFillColor(...c); doc.rect(x, y + 5, 1.3, kh - 10, 'F');
          font('bold', 6.8, GR); doc.text(T(l).toUpperCase(), x + 5, y + 7);
          font('bold', 22, c); doc.text(n, x + 5, y + 18.5);
          if (sub) { font('normal', 7.2, GR); doc.text(T(sub), x + 5, y + 23.4); }
          else {
            box(x + 5, y + 21.2, kw - 10, 2.6, WHITE, LINE, 1.3);
            if (pct > 0) { doc.setFillColor(...OL); doc.roundedRect(x + 5, y + 21.2, Math.max(2.6, (kw - 10) * pct / 100), 2.6, 1.3, 1.3, 'F'); }
          }
        });
      y += kh + 9;

      // 1 · Por agrícola
      sectionTitle(1, 'Bombas por agrícola', 10 * tipos.length);
      const maxT = Math.max(1, ...tipos.map(([, bs]) => bs.length));
      const bx = M + 40, bw = CW - 60, bh = 6.4;
      tipos.forEach(([t, bs]) => {
        ensure(10);
        const o = bs.filter((b) => b.estado === 'Operativa').length, f = bs.filter((b) => b.estado === 'Fuera de servicio').length;
        const ow = bw * o / maxT, fw = bw * f / maxT;
        font('bold', 8.4, INK); doc.text(T(t), M + 2, y + 4.6);
        box(bx, y, bw, bh, PAPER, null, 1.5);
        if (o) { doc.setFillColor(...OK); doc.roundedRect(bx, y, ow, bh, 1.5, 1.5, 'F'); if (fw) doc.rect(bx + ow - 2, y, 2, bh, 'F'); }
        if (f) { doc.setFillColor(...BAD); doc.roundedRect(bx + ow, y, fw, bh, 1.5, 1.5, 'F'); if (o) doc.rect(bx + ow, y, 2, bh, 'F'); }
        font('bold', 7.4, WHITE);
        if (o && ow > 6) doc.text(String(o), bx + ow / 2, y + 4.4, { align: 'center' });
        if (f && fw > 6) doc.text(String(f), bx + ow + fw / 2, y + 4.4, { align: 'center' });
        font('normal', 8, GR); doc.text(`${bs.length} bomba${bs.length === 1 ? '' : 's'}`, PW - M, y + 4.6, { align: 'right' });
        y += bh + 3.6;
      });
      font('normal', 7.4, GR);
      doc.setFillColor(...OK); doc.circle(bx + 1, y + 1.4, 1.1, 'F'); doc.text('Operativas', bx + 3.5, y + 2.4);
      doc.setFillColor(...BAD); doc.circle(bx + 26, y + 1.4, 1.1, 'F'); doc.text('Fuera de servicio', bx + 28.5, y + 2.4);
      y += 9;

      // 2 · Trabajos en proceso
      sectionTitle(2, 'Trabajos de mantenimiento en proceso', 30);
      if (!enProc.length) {
        box(M, y, CW, 12, OK_S, null);
        font('bold', 9, OK); doc.text('No hay trabajos de mantenimiento en proceso.', M + 5, y + 7.6);
        y += 18;
      } else {
        const cw2 = (CW - 4) / 2;
        for (let i = 0; i < enProc.length; i += 2) {
          const pair = enProc.slice(i, i + 2).map((m) => {
            const lines = wrap(m.descripcion, cw2 - 10, 8.2).slice(0, 4);
            const obs = m.obs ? wrap('Obs.: ' + m.obs, cw2 - 10, 7.2).slice(0, 3) : [];
            return { m, lines, obs, h: 15 + lines.length * lh(8.2) + (obs.length ? obs.length * lh(7.2) + 2 : 0) + 3 };
          });
          const h = Math.max(...pair.map((p) => p.h));
          ensure(h + 4);
          pair.forEach((p, j) => {
            const x = M + j * (cw2 + 4);
            box(x, y, cw2, h, AMB_S, null);
            doc.setFillColor(...AMB); doc.rect(x, y + 3, 1.3, h - 6, 'F');
            font('bold', 9.6, INK); doc.text(T(p.m.code), x + 5, y + 7);
            font('normal', 7.4, GR); doc.text(T(`${p.m.agricola} · ${fechaDe(p.m)}${p.m.usd ? ' · ' + usdTxt(p.m.usd) : ''}`), x + 5, y + 11.2);
            font('normal', 8.2, INK); doc.text(p.lines, x + 5, y + 16);
            if (p.obs.length) { font('italic', 7.2, GR); doc.text(p.obs, x + 5, y + 16 + p.lines.length * lh(8.2) + 1.6); }
            if (pageOf[p.m.code]) doc.link(x, y, cw2, h, { pageNumber: pageOf[p.m.code] });
          });
          y += h + 4;
        }
        y += 3;
      }

      // 3 · Situación por bomba
      sectionTitle(3, 'Situación por bomba', 40);
      table(['Código', 'Agrícola', 'Aplicación', 'Estado', 'Último mant.', 'Invertido', 'Pág.'],
        bombas.map((b) => {
          const ms = msDe(b.code); const u = ms.find((m) => m.fecha); const tot = ms.reduce((a, m) => a + (m.usd || 0), 0);
          return [{ content: T(b.code), page: pageOf[b.code] }, T(b.agricola), T(b.tipoLabel), { content: '', estado: b.estado === 's/d' ? 'Sin estado' : b.estado },
            u ? U.fmtF(u.fecha) : '-', tot ? usdTxt(tot) : '-',
            { content: pageOf[b.code] ? String(pageOf[b.code]) : '', styles: { halign: 'center', textColor: TEAL, fontStyle: 'bold' } }];
        }),
        { columnStyles: { 0: { cellWidth: 37, font: 'courier', fontStyle: 'bold', fontSize: 7.2 }, 1: { cellWidth: 33 }, 2: { cellWidth: 25 }, 3: { cellWidth: 31, minCellHeight: 8.5 }, 4: { cellWidth: 20 }, 6: { cellWidth: 10 } } });

      // 4 · Inversión
      const conFecha = mants.filter((m) => m.fecha);
      const anios = Array.from(new Set(conFecha.map((m) => m.fecha.slice(0, 4)))).sort();
      if (anios.length) {
        sectionTitle(4, 'Inversión en mantenimiento', 30);
        const filas = anios.map((a) => { const ms = conFecha.filter((m) => m.fecha.startsWith(a)); return [a, String(ms.length), usdTxt(ms.reduce((s, m) => s + (m.usd || 0), 0))]; });
        const total = mants.reduce((s, m) => s + (m.usd || 0), 0);
        filas.push([{ content: 'Total', styles: { fontStyle: 'bold' } }, { content: String(mants.length), styles: { fontStyle: 'bold' } }, { content: usdTxt(total), styles: { fontStyle: 'bold', textColor: OL } }]);
        table(['Año', 'Trabajos registrados', 'Presupuesto (USD)'], filas, { tableWidth: 110, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' } } });
      }
    }

    /* =========================== FICHA POR BOMBA =========================== */
    bombas.forEach((b, i) => {
      cur = { t: 'Bomba ' + b.code, s: `${b.agricola} · ${b.tipoLabel}` };
      if (multi || i > 0) newPage(); else { mark(); y = TOP_BAND; }
      starts[b.code] = doc.getNumberOfPages();
      const pc = b.pc;
      const [fg, bg] = colEstado(b.estado);
      const ms = msDe(b.code);
      let sec = 1;

      const hh = 44;
      box(M, y, CW, hh, bg, null, 3.2);
      doc.setFillColor(...fg); doc.rect(M, y + 4, 1.5, hh - 8, 'F');
      font('bold', 7.4, GR); doc.text(T(`${b.agricola} · ${b.tipoLabel}`).toUpperCase(), M + 6, y + 7.5);
      font('bold', 18, INK); doc.text(T(b.code), M + 6, y + 16.5);
      font('normal', 7.6, GR); doc.text('Estado según la hoja Registro BOMBA', M + 6, y + 21.5);
      const etiqueta = 'Bomba ' + (b.estado === 's/d' ? 'sin estado' : b.estado);
      font('bold', 8.5);
      const pw = doc.getTextWidth(T(etiqueta).toUpperCase()) + 9;
      pill(PW - M - 5 - pw, y + 5, etiqueta, WHITE, fg, 8.5);
      const parts = [['Finca', pc.finca], ['Sector', pc.sector || '-'], ['Aplicación', pc.tipo ? pc.tipo + ' · ' + b.tipoLabel : '-'],
        ['Instalación', U.INSTALACION[pc.inst] || pc.inst || '-'], ['Potencia', pc.hp ? pc.hp + ' HP' : (b.pot || '-')]];
      const pw5 = (CW - 12 - 4 * 2.5) / 5;
      parts.forEach(([l, val], k) => {
        const x = M + 6 + k * (pw5 + 2.5);
        box(x, y + 26, pw5, 13, WHITE, null, 2);
        font('normal', 6.4, GR); doc.text(T(l).toUpperCase(), x + 3, y + 30.5);
        font('bold', 8.2, INK); doc.text(doc.splitTextToSize(T(val), pw5 - 5).slice(0, 2), x + 3, y + 35.2);
      });
      y += hh + 7;

      sectionTitle(sec++, 'Equipo y ubicación', 50);
      const lw = CW * 0.58, rw = CW - lw - 4;
      const eq = [['Motor', b.motor || 's/d'], ['Bomba', b.bomba || 's/d'], ['Pot / capacidad', b.potencia || '-'], ['Corriente In (A)', b.corriente || '-'],
        ['Cañería', b.caneria || '-'], ['Alimentación', U.alimentacion(b.red)]];
      const ub = [['Agrícola', b.agricola], ['Coordenadas', b.lat != null ? `${b.lat.toFixed(5)}, ${b.lon.toFixed(5)}` : 'Sin coordenadas']];
      const hEq = Math.max(10 + kv(0, 0, lw - 9, eq, false, 28) + 3, 10 + kv(0, 0, rw - 9, ub, false, 24) + 3 + (b.lat != null ? 12 : 0));
      ensure(hEq);
      box(M, y, lw, hEq, WHITE, LINE); cardTitle(M, y, 'Equipo'); kv(M + 4.5, y + 10, lw - 9, eq, true, 28);
      box(M + lw + 4, y, rw, hEq, WHITE, LINE); cardTitle(M + lw + 4, y, 'Ubicación'); const ku = kv(M + lw + 8.5, y + 10, rw - 9, ub, true, 24);
      if (b.lat != null) {
        const bx2 = M + lw + 8.5, by = y + 10 + ku + 2.5, bw2 = rw - 9;
        box(bx2, by, bw2, 7.5, TEAL, null, 3.75);
        font('bold', 8, WHITE); doc.text('Abrir en Google Maps  >', bx2 + bw2 / 2, by + 5, { align: 'center' });
        doc.link(bx2, by, bw2, 7.5, { url: U.mapsUrl(b.lat, b.lon) });
      }
      y += hEq + 4;
      if (b.obs) {
        const ol = wrap(b.obs, CW - 12, 8.4);
        const oh = 9 + ol.length * lh(8.4) + 2;
        ensure(oh);
        box(M, y, CW, oh, AMB_S, null);
        doc.setFillColor(...AMB); doc.rect(M, y + 2.5, 1.3, oh - 5, 'F');
        font('bold', 7, AMB); doc.text('OBSERVACIONES', M + 5, y + 5.6);
        font('normal', 8.4, INK); doc.text(ol, M + 5, y + 10.2);
        y += oh + 4;
      }
      y += 3;

      sectionTitle(sec++, 'Historial de mantenimientos', 30);
      if (ms.length) {
        const tot = ms.reduce((a, m) => a + (m.usd || 0), 0);
        const ep = ms.filter((m) => m.trabajo === 'En proceso').length;
        font('normal', 8, GR);
        doc.text(T(`${ms.length} trabajo${ms.length === 1 ? '' : 's'} registrado${ms.length === 1 ? '' : 's'} · ${ep} en proceso · inversión ${usdTxt(tot)}`), M, y + 2);
        y += 5;
        table(['Fecha', 'Trabajo realizado', 'Recep./OC', 'USD', 'Estado'],
          ms.map((m) => [fechaDe(m), T(m.descripcion + (m.obs ? '\nObs.: ' + m.obs : '')), T(m.recep || '-'), m.usd ? usdTxt(m.usd).replace('USD ', '') : '-', { content: '', trabajo: m.trabajo }]),
          { columnStyles: { 0: { cellWidth: 20 }, 2: { cellWidth: 22 }, 3: { cellWidth: 18, halign: 'right' }, 4: { cellWidth: 27, minCellHeight: 8.5 } } });
      } else vacio('Sin mantenimientos registrados para esta bomba.');
    });

    /* =========================== ENCABEZADOS Y PIES =========================== */
    const n = doc.getNumberOfPages();
    const logoAt = (x, yy, s) => {
      box(x, yy, s, s, WHITE, null, s * 0.22);
      if (logo) { try { doc.addImage(logo.url, 'PNG', x + s * 0.12, yy + s * 0.12, s * 0.76, s * 0.76); } catch (e) { /* imagen inválida */ } }
      else { font('bold', 6.5, OL); doc.text('GRUPO MP', x + s / 2, yy + s / 2 + 1, { align: 'center' }); }
    };
    for (let p = 1; p <= n; p++) {
      doc.setPage(p);
      const tt = titles[p] || cur;
      if (p === 1) {
        doc.setFillColor(...DK); doc.rect(0, 0, PW, 54, 'F');
        doc.setFillColor(...DK2); doc.triangle(PW - 70, 0, PW, 0, PW, 54, 'F');
        doc.setFillColor(...LIME); doc.rect(0, 54, PW * 0.62, 1.6, 'F');
        doc.setFillColor(95, 227, 207); doc.rect(PW * 0.62, 54, PW * 0.38, 1.6, 'F');
        logoAt(PW - M - 26, 12, 26);
        font('bold', 7.6, LIME); doc.text('INGENIERÍA · MANTENIMIENTO · GRUPO MP', M, 17);
        font('bold', 21, WHITE); doc.text(T(tt.t), M, 29, { maxWidth: PW - 2 * M - 34 });
        font('normal', 9.5, [190, 210, 200]);
        doc.text(T(multi ? `Informe al ${hoy} · ${bombas.length} bombas` : `${tt.s} · ficha al ${hoy}`), M, 37);
        font('normal', 8, [150, 175, 165]); doc.text('Fuente: hojas Registro BOMBA y Mantenimiento de BOMBAS', M, 43.5);
      } else {
        doc.setFillColor(...DK); doc.rect(0, 0, PW, 3, 'F');
        doc.setFillColor(...LIME); doc.rect(0, 3, 40, 0.8, 'F');
        logoAt(PW - M - 15, 9, 15);
        font('bold', 6.8, OL); doc.text('INGENIERÍA · MANTENIMIENTO · GRUPO MP', M, 13);
        font('bold', 14, INK); doc.text(T(tt.t), M, 20.5, { maxWidth: PW - 2 * M - 22 });
        font('normal', 8.2, GR); doc.text(T(tt.s), M, 26);
        doc.setDrawColor(...LINE); doc.setLineWidth(0.4); doc.line(M, 30.5, PW - M, 30.5);
      }
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, 282, PW - M, 282);
      font('bold', 7.2, OL); doc.text('Grupo MP', M, 287);
      font('normal', 7.2, GR); doc.text('· Ingeniería · Bombas de agua', M + doc.getTextWidth('Grupo MP') + 1.5, 287);
      doc.text(`Generado el ${hoy}`, PW / 2, 287, { align: 'center' });
      font('bold', 7.2, INK); doc.text(`Página ${p} de ${n}`, PW - M, 287, { align: 'right' });
    }
    return { doc, starts, multi, bombas };
  }

  async function generar(codes, ctx) {
    if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF no cargó');
    if (typeof new window.jspdf.jsPDF().autoTable !== 'function') throw new Error('jspdf-autotable no cargó');
    const logo = await U.loadLogo();
    let out = build(codes, ctx, logo, {});
    if (out.multi) out = build(codes, ctx, logo, out.starts);
    if (!out.bombas.length) throw new Error('No hay bombas para el informe');
    out.doc.save(out.multi ? `Informe_Bombas_GrupoMP_${U.hoy()}.pdf` : `Bomba_${out.bombas[0].code}.pdf`);
  }
  return { generar };
})();

</script>
<script>
/* ---- js/bombas.js ---- */
/* Módulo BOMBAS DE AGUA — Grupo MP
   Lee "Registro BOMBA" y "Mantenimiento de BOMBAS" y escribe en esas mismas hojas.
   Se arma con las piezas compartidas de app.js: window.crearModuloBombas(G). */
window.crearModuloBombas = function (G) {
  'use strict';
  const { html, useState, useEffect, useMemo, useRef, RC, I, Tile, Inset, Fld, ConfirmDel, tooltipStyle, U } = G;
  const TRABAJOS = ['En proceso', 'Finalizado'];
  const clsB = (e) => /^Operativ/.test(e) ? 'ok' : e === 'Fuera de servicio' ? 'bad' : 'na';
  const clsT = (t) => t === 'Finalizado' ? 'ok' : t === 'En proceso' ? 'warn' : 'na';
  const glowB = (e) => /^Operativ/.test(e) ? 'var(--ok)' : e === 'Fuera de servicio' ? 'var(--bad)' : 'var(--aqua)';
  const short = (c) => U.shortCode(c || '');
  const lim = (v) => (v == null || v === '—' || v === 's/d') ? '' : String(v);

  function ChipB({ e }) { return html`<span class=${'chip ' + clsB(e)}><i></i>${e === 's/d' ? 'Sin estado' : e}</span>`; }
  function ChipT({ t }) { return html`<span class=${'chip ' + clsT(t)}><i></i>${t}</span>`; }
  const fechaDe = (m) => (m.fecha ? U.fmtF(m.fecha) : (m.fechaTxt || 'sin fecha'));
  const sumUSD = (ms) => ms.reduce((a, m) => a + (m.usd || 0), 0);

  /* =========================================================
     01 · RESUMEN
     ========================================================= */
  function ResumenB({ bombas, mants, openB, pal, goTab }) {
    const total = bombas.length;
    const op = bombas.filter((b) => b.estado === 'Operativa').length;
    const fs = bombas.filter((b) => b.estado === 'Fuera de servicio').length;
    const pct = total ? Math.round((op / total) * 100) : 0;
    const enProc = mants.filter((m) => m.trabajo === 'En proceso');
    const porFinca = U.groupBy(bombas, U.fincaDe).map(([t, bs]) => ({ finca: t, op: bs.filter((b) => b.estado === 'Operativa').length, fs: bs.filter((b) => b.estado === 'Fuera de servicio').length, n: bs.length }))
      .sort((a, b) => b.n - a.n);
    const fincas = U.groupBy(bombas, U.fincaDe);
    const ult = mants.filter((m) => m.fecha).slice(0, 5);
    const pieData = [{ name: 'Operativas', value: op, fill: 'url(#gOpB)' }, { name: 'Fuera de servicio', value: fs, fill: 'url(#gFsB)' }];
    if (total - op - fs > 0) pieData.push({ name: 'Sin estado', value: total - op - fs, fill: pal.na });
    return html`<div class="bento sec">
      <${Tile} c="s5 r2" title="Bombas registradas" glow="var(--aqua)" right=${html`<button class="chip warn click" onClick=${() => goTab('mant')}><i></i>${enProc.length} trabajo${enProc.length === 1 ? '' : 's'} en proceso</button>`}>
        <div class="donut">
          ${RC ? html`<${RC.ResponsiveContainer} width="100%" height="100%">
            <${RC.PieChart}>
              <defs>
                <linearGradient id="gOpB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color=${pal.lime}/><stop offset="100%" stop-color=${pal.aqua}/></linearGradient>
                <linearGradient id="gFsB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color=${pal.rose}/><stop offset="100%" stop-color=${pal.amber}/></linearGradient>
              </defs>
              <${RC.Pie} data=${pieData} dataKey="value" nameKey="name" innerRadius="68%" outerRadius="100%" paddingAngle=${4} cornerRadius=${10} stroke="none" startAngle=${90} endAngle=${-270}>
                ${pieData.map((d) => html`<${RC.Cell} key=${d.name} fill=${d.fill}/>`)}
              <//>
              <${RC.Tooltip} contentStyle=${tooltipStyle} itemStyle=${{ color: 'var(--fg)' }}/>
            <//>
          <//>` : null}
          <div class="center"><div><div class="big">${total}</div><div class="lbl">bombas</div></div></div>
        </div>
        <div class="kv" style=${{ gridTemplateColumns: '1fr 1fr' }}>
          <${Inset} l="Operativas"><div class="disp" style=${{ fontSize: 28, fontWeight: 600, color: 'var(--ok)' }}>${op}</div><//>
          <${Inset} l="Fuera de servicio"><div class="disp" style=${{ fontSize: 28, fontWeight: 600, color: 'var(--bad)' }}>${fs}</div><//>
        </div>
        <p class="note" style=${{ marginBottom: 0 }}>Estado según la columna “Estado Actual” de la hoja Registro BOMBA.</p>
      <//>

      <${Tile} c="s4" title="Disponibilidad de bombas" glow="var(--lime)" right=${html`<span class="chip ok"><i></i>${op} de ${total} operativas</span>`}>
        <div class="pct-big"><span class="grad">${pct}</span><small class="grad">%</small></div>
        <div class="bar bar-lg"><i style=${{ width: pct + '%' }}></i>${[25, 50, 75].map((t) => html`<b key=${t} style=${{ left: t + '%' }}></b>`)}</div>
        <div class="row between" style=${{ marginTop: 8 }}><span class="lbl">0%</span><span class="lbl">${fs} fuera de servicio</span><span class="lbl">100%</span></div>
      <//>

      <${Tile} c="s3" title="Fuera de servicio" glow="var(--bad)">
        <div class="big" style=${{ color: 'var(--bad)' }}>${fs}</div>
        <div class="row" style=${{ marginTop: 14, gap: 6 }}>
          ${bombas.filter((b) => b.estado === 'Fuera de servicio').map((b) => html`<button key=${b.code} class="chip bad click" onClick=${() => openB(b.code)}>${short(b.code)}</button>`)}
          ${fs === 0 ? html`<span class="note">Ninguna 🎉</span>` : null}
        </div>
      <//>

      <${Tile} c="s7" title="Bombas por agrícola">
        <div style=${{ height: 230 }}>
          ${RC ? html`<${RC.ResponsiveContainer} width="100%" height="100%">
            <${RC.BarChart} data=${porFinca} margin=${{ top: 6, right: 6, left: -22, bottom: 0 }} barCategoryGap="28%">
              <defs>
                <linearGradient id="bOpB" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color=${pal.aqua}/><stop offset="100%" stop-color=${pal.lime}/></linearGradient>
                <linearGradient id="bFsB" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color=${pal.amber}/><stop offset="100%" stop-color=${pal.rose}/></linearGradient>
              </defs>
              <${RC.CartesianGrid} stroke=${pal.grid} vertical=${false}/>
              <${RC.XAxis} dataKey="finca" tick=${{ fill: pal.axis, fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }} axisLine=${false} tickLine=${false}/>
              <${RC.YAxis} allowDecimals=${false} tick=${{ fill: pal.axis, fontSize: 11 }} axisLine=${false} tickLine=${false}/>
              <${RC.Tooltip} cursor=${{ fill: pal.grid }} contentStyle=${tooltipStyle}/>
              <${RC.Legend} iconType="circle" wrapperStyle=${{ fontSize: 12 }}/>
              <${RC.Bar} dataKey="op" name="Operativas" stackId="a" fill="url(#bOpB)" radius=${[0, 0, 8, 8]}/>
              <${RC.Bar} dataKey="fs" name="Fuera de servicio" stackId="a" fill="url(#bFsB)" radius=${[8, 8, 0, 0]}/>
            <//>

      <${Tile} c="s8" title="Detalle por agrícola" right=${html`<span class="lbl">Tocá una bomba para ver su ficha</span>`}>
        <div class="groups">
          ${fincas.map(([f, bs]) => html`<div class="inset" key=${f}>
            <div class="row between" style=${{ marginBottom: 8 }}><span class="lbl">${f}</span><span class="lbl">${bs.filter((b) => b.estado === 'Operativa').length}/${bs.length} operativas</span></div>
            <div class="bgrid">${bs.map((b) => html`<button key=${b.code} class="bchip" title=${b.code + ' · ' + b.tipoLabel} onClick=${() => openB(b.code)}>
